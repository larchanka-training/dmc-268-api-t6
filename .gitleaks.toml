[extend]
useDefault = true

[allowlist]
description = "Example config files and documented placeholder values only"
paths = [
  '''\.env\.example$''',
  '''.*\.tfvars\.example$''',
  '''.*\.backend\.hcl\.example$''',
]
regexes = [
  '''replace-with-''',
  '''your-objectstorage\.com''',
  '''203\.0\.113\.\d+/32''',
]
