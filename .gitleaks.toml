# Gitleaks scans the full repository, including docs/ and examples/.
# Allowlist only committed placeholder patterns — never real credentials.
# Dataset fixtures must use unmistakably fake credentials (for example,
# FAKE_TEST_CREDENTIAL_DO_NOT_USE). Keep scanning every dataset path; add a
# value-specific exception only if Gitleaks flags a future fake fixture.
# Local check: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
#   detect --source /src --config /src/.gitleaks.toml --no-banner --redact --exit-code 1

[extend]
useDefault = true

[allowlist]
description = "Documented placeholder values only (all paths are scanned)"
regexes = [
  '''replace-with-''',
  '''your-objectstorage\.com''',
  '''203\.0\.113\.\d+/32''',
  # Public conventions policy-key SHA-256 oracle from baseline 1ae74b1 (#212).
  # This exact digest is fixture data, not a credential; keep every path scanned.
  '''^24ab4f16f70b7124f9af6fd8e6000572622dc1f868f1980616b2519fd03c9821$''',
]
