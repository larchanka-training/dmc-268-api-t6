[project]
name = "database"
version = "0.1.0"
description = "Shared PostgreSQL persistence primitives and SQLAlchemy models"
requires-python = "==3.13.*"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
