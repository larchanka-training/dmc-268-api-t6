services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-dmc-268-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-dmc-268-ui}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # The schema is ready before the first request: /healthcheck is liveness only and does not
    # read the database (docs/BACKEND_ARCHITECTURE.md, "Readiness"). Unlike staging, the local
    # backend also waits for the broker, which is always part of this stack.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    # No HTTP port: the image healthcheck is replaced by the age of the heartbeat file, as on
    # staging, so `up --wait` waits until the consumers are attached.
    healthcheck:
      test: ["CMD", "python", "-m", "app.common.infrastructure.heartbeat", "/tmp/worker.heartbeat", "30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      PORTAL_URL: ${PORTAL_URL:-}
      # LLM gateway (#33): without LLM_MODEL the worker starts and every run fails with
      # llm_unavailable after all three attempts, naming the missing configuration.
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-}
      LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-}
      LLM_PRICE_CACHE_READ_PER_MTOK: ${LLM_PRICE_CACHE_READ_PER_MTOK:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_ALLOW_PROMPT_JSON: ${LLM_ALLOW_PROMPT_JSON:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_API_KEYS: ${LLM_FALLBACK_API_KEYS:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # One shot, as on staging (deploy/compose/staging.yml): migrations and the prompt seed complete
  # before backend and the workers start. A failure stops `up` with nothing started on top.
  bootstrap:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap.seed_prompts"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # backend and the workers wait for this check. The ping takes close to 10 s on a busy
      # machine, hence the longer timeout; start_period as on staging.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  webhook-worker:
    profiles: [webhooks]
    build: .
    command: ["python", "-m", "app.webhook_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.common.infrastructure.heartbeat", "/tmp/webhook-worker.heartbeat", "30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_BOT_LOGIN: ${GITHUB_APP_BOT_LOGIN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      WORKER_HEARTBEAT_FILE: /tmp/webhook-worker.heartbeat
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
