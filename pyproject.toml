[project]
name = "dmc-268-api-t6"
version = "0.1.0"
description = "AI Code Reviewer monorepo"
requires-python = "==3.13.*"
dependencies = []

[tool.uv.workspace]
members = ["services/*", "packages/*", "migrations"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
