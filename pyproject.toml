[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = "==3.13.*"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.16.0",
    "cryptography>=50.0.1",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "openapi-schema-validator>=0.9.0",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.11.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "types-jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.13"
strict = true
# `mypy .` does not walk `.agents/**` (dot-directory), so the create-issue skill is
# checked by an explicit command: see `.agents/skills/create-issue/SKILL.md`.
files = ["app", "tests"]
# Directories `mypy .` must not walk: the git-ignored report mirror duplicates modules of `app`,
# and the #146 RAG corpus holds one repository per case, so every case has its own `pkg/`
# (mypy stops with "Duplicate module named"). With mypy 2.3.1 a command-line `--exclude` does
# not switch this list off.
exclude = ["^docs/reports/", "^test-prs-dataset/rag/"]

# The #146 eval test fixtures (tests/fixtures/rag_eval, the Task 1 spike) are repositories
# under review: a case's defect is real code, so type errors in them are the point, not a
# finding. This covers these fixtures only.
[[tool.mypy.overrides]]
module = "tests.fixtures.rag_eval.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an explicitly configured disposable PostgreSQL database",
]

# Skylos quality gate (#263): scripts/skylos_quality.sh, CI job `Skylos quality`, docs/CICD.md.
# Skylos reads this table from the merge base of the diff, so a change applies after its merge.
[tool.skylos]
complexity = 10
max_args = 5
max_lines = 50
# Fake test secrets (the .gitleaks.toml allowlist) need no entry: under tests/ Skylos counts only
# provider-shaped secrets, and it finds none in the files that hold them.
exclude = [
    # Teaching Terraform stacks (#264): CI never applies them, findings there are noise.
    "terraform",
    # Eval corpus with intended defects; editing it changes the pinned eval inputs.
    "test-prs-dataset",
    # SYNC copy of the ui skill: a finding there is fixed in ui first, or the copies drift.
    ".agents/skills/create-issue",
]

[tool.skylos.gate]
max_quality = 0
max_high = 0
# Unused helpers are the dead code this gate is for (#263).
max_dead_code = 0
# A diff scan lists these function metrics as advice, which max_quality does not count.
rules = ["SKY-Q301", "SKY-C303", "SKY-C304"]
