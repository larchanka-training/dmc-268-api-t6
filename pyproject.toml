[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = "==3.13.*"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.16.0",
    "cryptography>=50.0.1",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "openapi-schema-validator>=0.9.0",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.11.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "types-jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "W",
    "FA",
    "G",
    "PIE",
    "T10",
    "TID",
    "PLE",
    "YTT",
    "ANN",
    "D",
]
ignore = [
    # mypy --strict enforces type safety; explicit Any covers 707 dynamic payloads/fakes/fixtures
    # across the repo (29 in app/, 537 in tests/, 17 in scripts/, 2 in review/, 122 in .agents/).
    "ANN401",
    # Docstring presence rules (12,229 existing symbols: 7,724 D103, 2,527 D102, 1,186 D101,
    # 540 D107, 184 D105, 42 D100, 26 D104) are omitted so tests/helpers need no ceremony.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    # Docstring formatting backlog (729 hits across repo, including 333 inside SYNC-mirrored
    # `.agents/` files owned by dmc-268-ui-t6):
    "D202",  # 8 hits (app: 4, tests: 4; all outside .agents)
    "D205",  # 365 hits (app: 101, tests: 74, scripts: 2, review: 26, .agents: 162)
    "D209",  # 327 hits (168 outside .agents, 159 in .agents)
    "D210",  # 1 hit (1 in .agents)
    "D301",  # 15 hits (14 outside .agents, 1 in .agents)
    "D403",  # 13 hits (3 outside .agents, 10 in .agents)
]

[tool.ruff.lint.pydocstyle]
# Disables conflicting blank-line/first-line rules (D203, D213) and D401 (647 imperative-mood hits).
convention = "google"

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.13"
strict = true
# `mypy .` does not walk `.agents/**` (dot-directory), so the create-issue skill is
# checked by an explicit command: see `.agents/skills/create-issue/SKILL.md`.
files = ["app", "tests"]
# Directories `mypy .` must not walk: the git-ignored report mirror duplicates modules of `app`,
# and the #146 RAG corpus holds one repository per case, so every case has its own `pkg/`
# (mypy stops with "Duplicate module named"). With mypy 2.3.1 a command-line `--exclude` does
# not switch this list off.
exclude = ["^docs/reports/", "^test-prs-dataset/rag/"]

# The #146 eval test fixtures (tests/fixtures/rag_eval, the Task 1 spike) are repositories
# under review: a case's defect is real code, so type errors in them are the point, not a
# finding. This covers these fixtures only.
[[tool.mypy.overrides]]
module = "tests.fixtures.rag_eval.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an explicitly configured disposable PostgreSQL database",
]
