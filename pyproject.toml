[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
requires-python = "==3.13.*"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.16.0",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "openapi-schema-validator>=0.9.0",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.11.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "types-jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.13"
strict = true
# `mypy .` does not walk `.agents/**` (dot-directory), so the create-issue skill is
# checked by an explicit command: see `.agents/skills/create-issue/SKILL.md`.
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an explicitly configured disposable PostgreSQL database",
]
