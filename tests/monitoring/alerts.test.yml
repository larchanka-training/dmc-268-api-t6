      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-b.scope"}'
        values: "_x6 180+30x3 stale"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-c.scope"}'
        values: "_x10 0 1x13"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-c.scope"}'
        values: "_x10 300+30x14"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x24"
      - series: 'container_health_state{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0 0 stale _x2 0 0 stale _x2 0 0 stale _x2 0 0 stale _x2 0 0"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0 30 stale _x2 150 180 stale _x2 300 330 stale _x2 450 480 stale _x2 600 630"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x24"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-old.scope"}'
        values: "0x12 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-old.scope"}'
        values: "0+30x12 stale"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-new.scope"}'
        values: "_x13 1x11"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-new.scope"}'
        values: "_x13 390+30x11"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
