        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."
          - exp_labels:
              severity: critical
              environment: staging
              container_label_com_docker_compose_project: dmc-268-api
            exp_annotations:
              summary: "webhook-worker of dmc-268-api is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api ps webhook-worker."
      - eval_time: 6m30s
