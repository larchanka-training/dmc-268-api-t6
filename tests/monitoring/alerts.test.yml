  # A webhook-worker stopped at 2m leaves cAdvisor at once and the cadvisor job marks its series
  # stale at the next scrape (2m30s): staging fires 5 minutes later (7m30s). The dmc-268-api-prod
  # series show a scrape without stale markers: the last samples stay for the 5 minutes of
  # lookback and the alert comes that much later (12m). A project stopped as a whole
  # (dmc-268-api, postgres a scrape later) does not page.
  - interval: 30s
    input_series:
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "1x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x30"
      - series: 'container_health_state{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "1x4"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0+30x4"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x30"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "1x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x5 stale"
    alert_rule_test:
      - eval_time: 7m
        alertname: WebhookWorkerDown
        exp_alerts: []
      - eval_time: 7m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
      - eval_time: 11m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
      - eval_time: 12m
