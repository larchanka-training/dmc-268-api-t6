# Unit tests of deploy/monitoring/prometheus/rules/alerts.yml, run by CI (job monitoring-validate):
#   docker run --rm --entrypoint promtool -v "$PWD:/w:ro" -w /w <prometheus image> \
#     test rules tests/monitoring/alerts.test.yml
rule_files:
  - ../../deploy/monitoring/prometheus/rules/alerts.yml

evaluation_interval: 30s

tests:
  # The DoD alert path: new dead letters, a queue without its worker, a backlog. The DLQ keeps
  # its 2 messages for days; the alert fires on the growth and is gone 15 minutes later.
  - interval: 30s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{queue="reviews.dlq", vhost="/"}'
        values: "0 0 2x40"
      - series: 'rabbitmq_detailed_queue_consumers{queue="review.run.fast", vhost="/"}'
        values: "1 1 0x20"
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="review.run.fast", vhost="/"}'
        values: "25x30"
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="retry.30s.fast", vhost="/"}'
        values: "500x30"
    alert_rule_test:
      - eval_time: 30s
        alertname: ReviewDeadLetters
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewDeadLetters
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: event
            exp_annotations:
              summary: "2 new message(s) in reviews.dlq in the last 15 minutes"
              description: "Retries exhausted, an unknown schema or an unexpected error (docs/PIPELINE_SPEC.md §4.4); the operator reads the DLQ."
      - eval_time: 17m
        alertname: ReviewDeadLetters
        exp_alerts: []
      - eval_time: 7m
        alertname: ReviewQueueWithoutConsumer
        exp_alerts:
          - exp_labels:
              severity: critical
              queue: review.run.fast
            exp_annotations:
              summary: "No worker consumes review.run.fast"
              description: "The review worker is down or detached from the broker for 5 minutes."
      # Retry queues hold messages on purpose: only review.run.* and review.publish count.
      - eval_time: 11m
        alertname: ReviewQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: review.run.fast
            exp_annotations:
              summary: "25 message(s) wait in review.run.fast"
              description: "The queue has held more than 20 ready messages for 10 minutes; workers do not keep up."

  # Failed and stuck runs from the PostgreSQL review metrics.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_finished_15m_runs{state="succeeded"}'
        values: "4x10"
      - series: 'dmc_runs_finished_15m_runs{state="failed"}'
        values: "_ _ 1x8"
      - series: 'dmc_runs_active_stale_queued'
        values: "0 0 2x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: ReviewRunsFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewRunsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: event
            exp_annotations:
              summary: "1 review run(s) failed in the last 15 minutes"
              description: "Open the runs with state failed in the portal or the Grafana dashboard for error_code."
      - eval_time: 8m
        alertname: ReviewRunsStuckInQueue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "2 run(s) queued for more than 10 minutes"
              description: "Runs stay queued past available_at (T18 of docs/PIPELINE_SPEC.md §3)."

  # LLM latency needs both a slow p95 and enough calls: one slow call does not page.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_calls_15m_p95_seconds'
        values: "80x30"
      - series: 'dmc_llm_calls_15m_calls'
        values: "1x10 5x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: LlmLatencyHigh
        exp_alerts: []
      - eval_time: 21m
        alertname: LlmLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "LLM calls are slow: p95 1m 20s over 15 minutes"
              description: "The fast-engine call timeout is 90 s (docs/PIPELINE_SPEC.md §3)."

  # 5xx share per host, with a minimum of traffic; the metrics endpoint of Caddy (host _other) and
  # other hosts do not count.
  - interval: 1m
    input_series:
      - series: 'caddy_http_request_duration_seconds_count{host="staging-api.example.test", code="200"}'
        values: "0+60x20"
      - series: 'caddy_http_request_duration_seconds_count{host="staging-api.example.test", code="502"}'
        values: "0+12x20"
      - series: 'caddy_http_request_duration_seconds_count{host="api.example.test", code="503"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiHigh5xxRate
        exp_alerts:
          - exp_labels:
              severity: critical
              host: staging-api.example.test
            exp_annotations:
              summary: "staging-api.example.test: 16.67% of requests end in 5xx"
              description: "More than 5% of requests to staging-api.example.test returned 5xx for 5 minutes."

  - interval: 1m
    input_series:
      - series: 'up{job="rabbitmq", instance="rabbitmq:15692"}'
        values: "1 1 0x10"
      - series: 'node_memory_MemAvailable_bytes{instance="node-exporter:9100"}'
        values: "50x20"
      - series: 'node_memory_MemTotal_bytes{instance="node-exporter:9100"}'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: rabbitmq
              instance: rabbitmq:15692
            exp_annotations:
              summary: "Scrape target rabbitmq (rabbitmq:15692) is down"
              description: "Prometheus has not reached rabbitmq for 5 minutes."
      - eval_time: 11m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: node-exporter:9100
            exp_annotations:
              summary: "Host memory available: 5%"
              description: "Less than 10% of the VPS memory has been available for 10 minutes."

  # External probes: a name that fails for 5 minutes pages without any Caddy series (no traffic
  # needed); a name down 4.5 minutes at a time, then answering once, does not.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "1 0x10"
      - series: 'probe_success{job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "1 0x4 1 0x4 1"
    alert_rule_test:
      - eval_time: 5m30s
        alertname: PublicEndpointDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "api.example.test is down from outside"
              description: "The HTTPS probe of https://api.example.test/healthcheck has failed for 5 minutes: a connection or TLS error or a non-2xx answer, the 503 stub included."
      - eval_time: 7m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "api.example.test is down from outside"
              description: "The HTTPS probe of https://api.example.test/healthcheck has failed for 5 minutes: a connection or TLS error or a non-2xx answer, the 503 stub included."

  # webhook-worker unhealthy (health 0) from 1m pages at 6m, per project: staging and prod alike.
  # A container without a healthcheck (-1, dmc-268-api) and the projects of other apps do not.
  - interval: 30s
    input_series:
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "1 1 0x20"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x22"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "1x22"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "1 1 0x20"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x22"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "-1x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x22"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="other-app", container_label_com_docker_compose_service="webhook-worker", name="other-app-webhook-worker-1"}'
        values: "0x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="other-app", container_label_com_docker_compose_service="webhook-worker", name="other-app-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="other-app", container_label_com_docker_compose_service="postgres", name="other-app-postgres-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="other-db", container_label_com_docker_compose_service="postgres", name="other-db-postgres-1"}'
        values: "0+30x22"
    alert_rule_test:
      - eval_time: 5m30s
        alertname: WebhookWorkerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."

  # A webhook-worker stopped at 2m leaves cAdvisor at once and the cadvisor job marks its series
  # stale at the next scrape (2m30s): staging fires 5 minutes later (7m30s). The dmc-268-api-prod
  # series show a scrape without stale markers: the last samples stay for the 5 minutes of
  # lookback and the alert comes that much later (12m). A project stopped as a whole
  # (dmc-268-api, postgres a scrape later) does not page.
  - interval: 30s
    input_series:
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "1x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x30"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "1x4"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0+30x4"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x30"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "1x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x5 stale"
    alert_rule_test:
      - eval_time: 7m
        alertname: WebhookWorkerDown
        exp_alerts: []
      - eval_time: 7m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
      - eval_time: 11m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
      - eval_time: 12m
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-staging
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-staging is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-staging ps webhook-worker."
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."

  # postgres and webhook-worker stopped at 2m while api and rabbitmq still run: no page here
  # (PostgresDown's case on staging), the rule anchors on postgres, not on any container.
  - interval: 30s
    input_series:
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "1x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="api", name="dmc-268-api-staging-api-1"}'
        values: "0+30x30"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="rabbitmq", name="dmc-268-api-staging-rabbitmq-1"}'
        values: "0+30x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: WebhookWorkerDown
        exp_alerts: []

  # Restarts, each old container stale at the next scrape. Staging recreated twice (a deploy after
  # a minute without a worker, then a rollback; each new container starting for a scrape) does
  # not page. Prod in a crash loop (up and starting for a minute, then gone for 1.5 minutes) pages
  # at 5m: health 0 and absence alternate under one label set, so `for` does not restart.
  # dmc-268-api, unhealthy from 0, pages at 5m and resolves at the first healthy sample of its
  # recreated container (6m30s).
  - interval: 30s
    input_series:
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-a.scope"}'
        values: "1x4 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-a.scope"}'
        values: "0+30x4 stale"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-b.scope"}'
        values: "_x6 0 1 1 1 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-b.scope"}'
        values: "_x6 180+30x3 stale"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-c.scope"}'
        values: "_x10 0 1x13"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-c.scope"}'
        values: "_x10 300+30x14"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x24"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0 0 stale _x2 0 0 stale _x2 0 0 stale _x2 0 0 stale _x2 0 0"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0 30 stale _x2 150 180 stale _x2 300 330 stale _x2 450 480 stale _x2 600 630"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x24"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-old.scope"}'
        values: "0x12 stale"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-old.scope"}'
        values: "0+30x12 stale"
      - series: 'container_health_state{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-new.scope"}'
        values: "_x13 1x11"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1", id="/system.slice/docker-new.scope"}'
        values: "_x13 390+30x11"
      - series: 'container_last_seen{job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x24"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: WebhookWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api
            exp_annotations:
              summary: "webhook-worker of dmc-268-api is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api ps webhook-worker."
      - eval_time: 6m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."
      - eval_time: 10m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."

  # Certificates: at 10m (expiry = days left × 86400 + 600) 15 days left is quiet, 13 days warns,
  # 2 days warns and pages at once (no inhibit rules), each after its 10 minutes.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "1296600x10"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "1123800x10"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "173400x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://staging-api.example.test/healthcheck
              host: staging-api.example.test
            exp_annotations:
              summary: "Certificate of staging-api.example.test expires in 13.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 10m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Boundaries: staging-api reaches 14 days and api 3 days exactly at 10m. Exactly 14 or 3 days
  # does not count, so both become pending at 10m30s and fire at 20m30s, not at 20m; their
  # summaries round up to 14.0 and 3.0.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "1210200x21"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "259800x21"
    alert_rule_test:
      - eval_time: 20m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://staging-api.example.test/healthcheck
              host: staging-api.example.test
            exp_annotations:
              summary: "Certificate of staging-api.example.test expires in 14.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m
        alertname: TlsCertificateExpiring
        exp_alerts: []
      - eval_time: 20m30s
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Failed probes: without a TLS answer the probe has no expiry series (a stale marker, then
  # nothing). One at 5m does not restart the 10 minutes; nine in a row while firing (12m-20m) do
  # not resolve the alerts; 10 minutes after the last answer (29m) they are gone, an outage that
  # long is PublicEndpointDown's.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "172800x4 stale 172800x5 stale _x8 172800x8 stale"
    alert_rule_test:
      - eval_time: 10m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 10m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 39m
        alertname: TlsCertificateExpiresSoon
        exp_alerts: []
      - eval_time: 39m
        alertname: TlsCertificateExpiring
        exp_alerts: []

  # A renewed certificate (2 days, then 90 from 15m) resolves both alerts at the next probe.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "172800x14 7776000x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: TlsCertificateExpiresSoon
        exp_alerts: []
      - eval_time: 15m
        alertname: TlsCertificateExpiring
        exp_alerts: []

  # A sudden drop (20 days, then 2 from 5m) counts from the drop: both alerts fire at 15m.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "1728000x4 172800x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 15m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Backups: a day-old dump is fine, 26 hours is stale; a failed attempt warns at once; no
  # status at all for 2 hours means the service is gone.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_last_success_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "0x1700"
      - series: 'dmc_pg_backup_last_run_success{job="node", instance="node-exporter:9100"}'
        values: "1x10 0x5 1x10"
    alert_rule_test:
      - eval_time: 24h
        alertname: PostgresBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Last verified PostgreSQL backup is 1d 3h 0m 0s old"
              description: "No dump has passed the restore check for more than 26 hours (daily schedule)."
      - eval_time: 12m
        alertname: PostgresBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The last PostgreSQL backup attempt failed"
              description: "See docker compose -p dmc-268-monitoring logs pg-backup; the next attempt runs within an hour."
      - eval_time: 20m
        alertname: PostgresBackupFailed
        exp_alerts: []
      # No heartbeat series in this group at all: a service that never ran.
      - eval_time: 15m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # A heartbeat that stops at 30 min (container gone, its textfile left behind): no alert while it
  # is younger than 2 h, an alert 10 minutes after.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_heartbeat_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "0+60x30 1800x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupMissing
        exp_alerts: []
      - eval_time: 2h45m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # Off-host copy: a pass every 15 min is fine; 3 h without one is stale; failing passes warn
  # after an hour, also when no pass ever succeeded (no success timestamp at all).
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_offsite_last_success_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "0x300"
      - series: 'dmc_pg_backup_offsite_last_run_success{job="node", instance="node-exporter:9100"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupOffsiteStale
        exp_alerts: []
      - eval_time: 3h15m
        alertname: PostgresBackupOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy last succeeded 3h 15m 0s ago"
              description: "backup-offsite has not reached the bucket for 3 hours; see docker compose -p dmc-268-monitoring logs backup-offsite."
      - eval_time: 50m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts: []
      - eval_time: 61m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy fails"
              description: "Every backup-offsite pass of the last hour failed (bucket, keys or network)."
