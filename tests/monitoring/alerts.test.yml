            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Backups: a day-old dump is fine, 26 hours is stale; a failed attempt warns at once; no
  # status at all for 2 hours means the service is gone.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_last_success_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x1700"
      - series: 'dmc_pg_backup_last_run_success{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "1x10 0x5 1x10"
    alert_rule_test:
      - eval_time: 24h
        alertname: PostgresBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Last verified PostgreSQL backup is 1d 3h 0m 0s old"
              description: "No dump has passed the restore check for more than 26 hours (daily schedule)."
      - eval_time: 12m
        alertname: PostgresBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The last PostgreSQL backup attempt failed"
              description: "See docker compose -p dmc-268-monitoring logs pg-backup; the next attempt runs within an hour."
      - eval_time: 20m
        alertname: PostgresBackupFailed
        exp_alerts: []
      # No heartbeat series in this group at all: a service that never ran.
      - eval_time: 15m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # A heartbeat that stops at 30 min (container gone, its textfile left behind): no alert while it
  # is younger than 2 h, an alert 10 minutes after.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_heartbeat_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0+60x30 1800x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupMissing
        exp_alerts: []
      - eval_time: 2h45m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # Off-host copy: a pass every 15 min is fine; 3 h without one is stale; failing passes warn
  # after an hour, also when no pass ever succeeded (no success timestamp at all).
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_offsite_last_success_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x300"
      - series: 'dmc_pg_backup_offsite_last_run_success{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupOffsiteStale
        exp_alerts: []
      - eval_time: 3h15m
        alertname: PostgresBackupOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy last succeeded 3h 15m 0s ago"
              description: "backup-offsite has not reached the bucket for 3 hours; see docker compose -p dmc-268-monitoring logs backup-offsite."
      - eval_time: 50m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts: []
      - eval_time: 61m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy fails"
              description: "Every backup-offsite pass of the last hour failed (bucket, keys or network)."

  # Staging and prod side by side: a fault of one environment fires for it alone. The prod worker
  # leaves its queue at 1m and a prod run fails at 2m while staging stays healthy; summing over
  # the environments would hide both.
  - interval: 30s
    input_series:
      - series: 'rabbitmq_detailed_queue_consumers{environment="staging", queue="review.run.fast", vhost="/"}'
        values: "1x20"
      - series: 'rabbitmq_detailed_queue_consumers{environment="prod", queue="review.run.fast", vhost="/"}'
        values: "1 1 0x20"
      - series: 'dmc_runs_finished_15m_runs{environment="staging", state="failed"}'
        values: "0x20"
      - series: 'dmc_runs_finished_15m_runs{environment="prod", state="failed"}'
        values: "_ _ 1x18"
    alert_rule_test:
      - eval_time: 7m
        alertname: ReviewQueueWithoutConsumer
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              queue: review.run.fast
            exp_annotations:
              summary: "No worker consumes review.run.fast"
              description: "The review worker is down or detached from the broker for 5 minutes."
      - eval_time: 2m
        alertname: ReviewRunsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              kind: event
            exp_annotations:
              summary: "1 review run(s) failed in the last 15 minutes"
              description: "Open the runs with state failed in the portal or the Grafana dashboard for error_code."

  # The stores of prod are down while those of staging answer: the exporters' own series name the
  # environment.
  - interval: 1m
    input_series:
      - series: 'pg_up{environment="staging", job="postgres", instance="postgres-exporter:9187"}'
        values: "1x10"
      - series: 'pg_up{environment="prod", job="postgres", instance="postgres-exporter-prod:9187"}'
        values: "1 0x9"
      - series: 'redis_up{environment="staging", job="redis", instance="redis-exporter:9121"}'
        values: "1x10"
      - series: 'redis_up{environment="prod", job="redis", instance="redis-exporter-prod:9121"}'
        values: "1 0x9"
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: postgres
              instance: postgres-exporter-prod:9187
            exp_annotations:
              summary: "PostgreSQL is unreachable"
              description: "postgres-exporter cannot connect to PostgreSQL for 2 minutes."
      - eval_time: 8m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: redis
              instance: redis-exporter-prod:9121
            exp_annotations:
              summary: "Redis cache is unreachable"
              description: "The review context runs without its cache (SD §10) until Redis is back."

  # Host resources are shared by both environments: the alerts carry environment shared.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{environment="shared", instance="node-exporter:9100", mountpoint="/", fstype="ext4"}'
        values: "10x20"
      - series: 'node_filesystem_size_bytes{environment="shared", instance="node-exporter:9100", mountpoint="/", fstype="ext4"}'
        values: "100x20"
      - series: 'node_cpu_seconds_total{environment="shared", instance="node-exporter:9100", cpu="0", mode="idle"}'
        values: "0+3x40"
    alert_rule_test:
      - eval_time: 11m
        alertname: HostDiskFull
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Root filesystem free: 10%"
              description: "Less than 15% of the root filesystem is free."
      - eval_time: 25m
        alertname: HostCpuHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "Host CPU busy: 95%"
              description: "The VPS has been more than 90% busy for 15 minutes."

  # An OOM kill carries the environment of the project the container belongs to.
  - interval: 1m
    input_series:
      - series: 'container_oom_events_total{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="api", name="dmc-268-api-prod-api-1"}'
        values: "0 0 1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerOomKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: cadvisor
              container_label_com_docker_compose_project: dmc-268-api-prod
              container_label_com_docker_compose_service: api
              name: dmc-268-api-prod-api-1
            exp_annotations:
              summary: "Container dmc-268-api-prod-api-1 was OOM-killed"
              description: "The kernel killed a process of dmc-268-api-prod-api-1 for lack of memory in the last 10 minutes."
