  # at 5m: health 0 and absence alternate under one label set, so `for` does not restart.
  # dmc-268-api, unhealthy from 0, pages at 5m and resolves at the first healthy sample of its
  # recreated container (6m30s).
  - interval: 30s
    input_series:
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-a.scope"}'
        values: "1x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1", id="/system.slice/docker-a.scope"}'
        values: "0+30x4 stale"
