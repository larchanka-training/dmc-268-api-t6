        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."
          - exp_labels:
              severity: critical
              environment: staging
              container_label_com_docker_compose_project: dmc-268-api
            exp_annotations:
              summary: "webhook-worker of dmc-268-api is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api ps webhook-worker."
      - eval_time: 6m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."
      - eval_time: 10m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              container_label_com_docker_compose_project: dmc-268-api-prod
            exp_annotations:
              summary: "webhook-worker of dmc-268-api-prod is stopped or unhealthy"
              description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p dmc-268-api-prod ps webhook-worker."

  # Certificates: at 10m (expiry = days left × 86400 + 600) 15 days left is quiet, 13 days warns,
  # 2 days warns and pages at once (no inhibit rules), each after its 10 minutes.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{environment="staging", job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "1296600x10"
      - series: 'probe_ssl_earliest_cert_expiry{environment="staging", job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "1123800x10"
      - series: 'probe_ssl_earliest_cert_expiry{environment="prod", job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "173400x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: blackbox
              instance: https://staging-api.example.test/healthcheck
              host: staging-api.example.test
            exp_annotations:
              summary: "Certificate of staging-api.example.test expires in 13.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
          - exp_labels:
              severity: warning
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 10m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Boundaries: staging-api reaches 14 days and api 3 days exactly at 10m. Exactly 14 or 3 days
  # does not count, so both become pending at 10m30s and fire at 20m30s, not at 20m; their
  # summaries round up to 14.0 and 3.0.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{environment="staging", job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "1210200x21"
      - series: 'probe_ssl_earliest_cert_expiry{environment="prod", job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "259800x21"
    alert_rule_test:
      - eval_time: 20m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: blackbox
              instance: https://staging-api.example.test/healthcheck
              host: staging-api.example.test
            exp_annotations:
              summary: "Certificate of staging-api.example.test expires in 14.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
          - exp_labels:
              severity: warning
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m
        alertname: TlsCertificateExpiring
        exp_alerts: []
      - eval_time: 20m30s
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 3.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Failed probes: without a TLS answer the probe has no expiry series (a stale marker, then
  # nothing). One at 5m does not restart the 10 minutes; nine in a row while firing (12m-20m) do
  # not resolve the alerts; 10 minutes after the last answer (29m) they are gone, an outage that
  # long is PublicEndpointDown's.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{environment="staging", job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "172800x4 stale 172800x5 stale _x8 172800x8 stale"
    alert_rule_test:
      - eval_time: 10m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 10m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 20m30s
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: blackbox
              instance: https://staging-ui.example.test/health
              host: staging-ui.example.test
            exp_annotations:
              summary: "Certificate of staging-ui.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 39m
        alertname: TlsCertificateExpiresSoon
        exp_alerts: []
      - eval_time: 39m
        alertname: TlsCertificateExpiring
        exp_alerts: []

  # A renewed certificate (2 days, then 90 from 15m) resolves both alerts at the next probe.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{environment="staging", job="blackbox", instance="https://staging-api.example.test/healthcheck", host="staging-api.example.test"}'
        values: "172800x14 7776000x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: TlsCertificateExpiresSoon
        exp_alerts: []
      - eval_time: 15m
        alertname: TlsCertificateExpiring
        exp_alerts: []

  # A sudden drop (20 days, then 2 from 5m) counts from the drop: both alerts fire at 15m.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{environment="prod", job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "1728000x4 172800x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: TlsCertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."
      - eval_time: 15m
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "Certificate of api.example.test expires in 2.0 days"
              description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  # Backups: a day-old dump is fine, 26 hours is stale; a failed attempt warns at once; no
  # status at all for 2 hours means the service is gone.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_last_success_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x1700"
      - series: 'dmc_pg_backup_last_run_success{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "1x10 0x5 1x10"
    alert_rule_test:
      - eval_time: 24h
        alertname: PostgresBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Last verified PostgreSQL backup is 1d 3h 0m 0s old"
              description: "No dump has passed the restore check for more than 26 hours (daily schedule)."
      - eval_time: 12m
        alertname: PostgresBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The last PostgreSQL backup attempt failed"
              description: "See docker compose -p dmc-268-monitoring logs pg-backup; the next attempt runs within an hour."
      - eval_time: 20m
        alertname: PostgresBackupFailed
        exp_alerts: []
      # No heartbeat series in this group at all: a service that never ran.
      - eval_time: 15m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # A heartbeat that stops at 30 min (container gone, its textfile left behind): no alert while it
  # is younger than 2 h, an alert 10 minutes after.
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_heartbeat_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0+60x30 1800x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupMissing
        exp_alerts: []
      - eval_time: 2h45m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "The PostgreSQL backup service has not run for 2 hours"
              description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

  # Off-host copy: a pass every 15 min is fine; 3 h without one is stale; failing passes warn
  # after an hour, also when no pass ever succeeded (no success timestamp at all).
  - interval: 1m
    input_series:
      - series: 'dmc_pg_backup_offsite_last_success_timestamp_seconds{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x300"
      - series: 'dmc_pg_backup_offsite_last_run_success{environment="staging", job="node", instance="node-exporter:9100"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupOffsiteStale
        exp_alerts: []
      - eval_time: 3h15m
        alertname: PostgresBackupOffsiteStale
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy last succeeded 3h 15m 0s ago"
              description: "backup-offsite has not reached the bucket for 3 hours; see docker compose -p dmc-268-monitoring logs backup-offsite."
      - eval_time: 50m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts: []
      - eval_time: 61m
        alertname: PostgresBackupOffsiteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: "Off-host backup copy fails"
              description: "Every backup-offsite pass of the last hour failed (bucket, keys or network)."

  # Staging and prod side by side: a fault of one environment fires for it alone. The prod worker
  # leaves its queue at 1m and a prod run fails at 2m while staging stays healthy; summing over
  # the environments would hide both.
  - interval: 30s
    input_series:
      - series: 'rabbitmq_detailed_queue_consumers{environment="staging", queue="review.run.fast", vhost="/"}'
        values: "1x20"
      - series: 'rabbitmq_detailed_queue_consumers{environment="prod", queue="review.run.fast", vhost="/"}'
        values: "1 1 0x20"
      - series: 'dmc_runs_finished_15m_runs{environment="staging", state="failed"}'
        values: "0x20"
      - series: 'dmc_runs_finished_15m_runs{environment="prod", state="failed"}'
        values: "_ _ 1x18"
    alert_rule_test:
      - eval_time: 7m
        alertname: ReviewQueueWithoutConsumer
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              queue: review.run.fast
            exp_annotations:
              summary: "No worker consumes review.run.fast"
              description: "The review worker is down or detached from the broker for 5 minutes."
      - eval_time: 2m
        alertname: ReviewRunsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              kind: event
            exp_annotations:
              summary: "1 review run(s) failed in the last 15 minutes"
              description: "Open the runs with state failed in the portal or the Grafana dashboard for error_code."

  # The stores of prod are down while those of staging answer: the exporters' own series name the
  # environment.
  - interval: 1m
    input_series:
      - series: 'pg_up{environment="staging", job="postgres", instance="postgres-exporter:9187"}'
        values: "1x10"
      - series: 'pg_up{environment="prod", job="postgres", instance="postgres-exporter-prod:9187"}'
        values: "1 0x9"
      - series: 'redis_up{environment="staging", job="redis", instance="redis-exporter:9121"}'
        values: "1x10"
      - series: 'redis_up{environment="prod", job="redis", instance="redis-exporter-prod:9121"}'
        values: "1 0x9"
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: postgres
              instance: postgres-exporter-prod:9187
            exp_annotations:
              summary: "PostgreSQL is unreachable"
              description: "postgres-exporter cannot connect to PostgreSQL for 2 minutes."
      - eval_time: 8m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: redis
              instance: redis-exporter-prod:9121
            exp_annotations:
              summary: "Redis cache is unreachable"
              description: "The review context runs without its cache (SD §10) until Redis is back."

  # Host resources are shared by both environments: the alerts carry environment shared.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{environment="shared", instance="node-exporter:9100", mountpoint="/", fstype="ext4"}'
        values: "10x20"
      - series: 'node_filesystem_size_bytes{environment="shared", instance="node-exporter:9100", mountpoint="/", fstype="ext4"}'
        values: "100x20"
      - series: 'node_cpu_seconds_total{environment="shared", instance="node-exporter:9100", cpu="0", mode="idle"}'
        values: "0+3x40"
    alert_rule_test:
      - eval_time: 11m
        alertname: HostDiskFull
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Root filesystem free: 10%"
              description: "Less than 15% of the root filesystem is free."
      - eval_time: 25m
        alertname: HostCpuHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "Host CPU busy: 95%"
              description: "The VPS has been more than 90% busy for 15 minutes."

  # An OOM kill carries the environment of the project the container belongs to.
  - interval: 1m
    input_series:
      - series: 'container_oom_events_total{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="api", name="dmc-268-api-prod-api-1"}'
        values: "0 0 1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerOomKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              job: cadvisor
              container_label_com_docker_compose_project: dmc-268-api-prod
              container_label_com_docker_compose_service: api
              name: dmc-268-api-prod-api-1
            exp_annotations:
              summary: "Container dmc-268-api-prod-api-1 was OOM-killed"
              description: "The kernel killed a process of dmc-268-api-prod-api-1 for lack of memory in the last 10 minutes."

  # Dead letters and a backlog in prod while staging is quiet: each alert names prod alone.
  - interval: 30s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{environment="staging", queue="reviews.dlq", vhost="/"}'
        values: "0x40"
      - series: 'rabbitmq_detailed_queue_messages{environment="prod", queue="reviews.dlq", vhost="/"}'
        values: "0 0 2x40"
      - series: 'rabbitmq_detailed_queue_messages_ready{environment="staging", queue="review.run.fast", vhost="/"}'
        values: "5x30"
      - series: 'rabbitmq_detailed_queue_messages_ready{environment="prod", queue="review.run.fast", vhost="/"}'
        values: "25x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: ReviewDeadLetters
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              kind: event
            exp_annotations:
              summary: "2 new message(s) in reviews.dlq in the last 15 minutes"
              description: "Retries exhausted, an unknown schema or an unexpected error (docs/PIPELINE_SPEC.md §4.4); the operator reads the DLQ."
      - eval_time: 11m
        alertname: ReviewQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              queue: review.run.fast
            exp_annotations:
              summary: "25 message(s) wait in review.run.fast"
              description: "The queue has held more than 20 ready messages for 10 minutes; workers do not keep up."

  # Stuck runs, slow LLM calls and runs skipped by the daily budget in prod only.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_active_stale_queued{environment="staging"}'
        values: "0x12"
      - series: 'dmc_runs_active_stale_queued{environment="prod"}'
        values: "0 0 2x10"
      - series: 'dmc_llm_calls_15m_p95_seconds{environment="staging"}'
        values: "10x30"
      - series: 'dmc_llm_calls_15m_calls{environment="staging"}'
        values: "5x30"
      - series: 'dmc_llm_calls_15m_p95_seconds{environment="prod"}'
        values: "80x30"
      - series: 'dmc_llm_calls_15m_calls{environment="prod"}'
        values: "1x10 5x20"
      - series: 'dmc_runs_budget_paused_15m_runs{environment="staging"}'
        values: "0x12"
      - series: 'dmc_runs_budget_paused_15m_runs{environment="prod"}'
        values: "0 0 2x5 0x70"
    alert_rule_test:
      - eval_time: 8m
        alertname: ReviewRunsStuckInQueue
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "2 run(s) queued for more than 10 minutes"
              description: "Runs stay queued past available_at (T18 of docs/PIPELINE_SPEC.md §3)."
      - eval_time: 21m
        alertname: LlmLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "LLM calls are slow: p95 1m 20s over 15 minutes"
              description: "The fast-engine call timeout is 90 s (docs/PIPELINE_SPEC.md §3)."
      - eval_time: 2m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              kind: event
            exp_annotations:
              summary: "2 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."

  # SLA availability of prod (docs/MONITORING.md §12). The timeline starts on 1 January 1970, a
  # month of 31 days: the allowance is 0.5 % of 2 678 400 s = 13 392 s (223.2 minutes), half of it
  # 6 696 s. Probes every minute; a failed probe counts 60 s of downtime. promtool compares floats
  # exactly, so the recorded values are rounded.
  # 100 minutes of downtime of api stay below half of the allowance; the other prod name, which
  # never fails, and a staging probe that fails the whole time raise nothing and have no sla: series.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x59 0x99 1x200"
      - series: 'probe_success{job="blackbox", environment="prod", host="ui.example.test", instance="https://ui.example.test/"}'
        values: "1x300"
      - series: 'probe_success{job="blackbox", environment="staging", host="staging-api.example.test", instance="https://staging-api.example.test/healthcheck"}'
        values: "0x300"
    alert_rule_test:
      - eval_time: 4h
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []
      - eval_time: 4h
        alertname: SlaAvailabilityBreached
        exp_alerts: []
    promql_expr_test:
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 6000
          - labels: '{environment="prod", host="ui.example.test"}'
            value: 0
      - expr: sla:downtime_seconds:month{environment="staging"}
        eval_time: 4h
        exp_samples: []
      - expr: sla:month_start_timestamp_seconds
        eval_time: 4h
        exp_samples:
          - labels: 'sla:month_start_timestamp_seconds{environment="shared"}'
            value: 0
      - expr: sla:downtime_budget_seconds:month
        eval_time: 4h
        exp_samples:
          - labels: 'sla:downtime_budget_seconds:month{environment="prod"}'
            value: 13392

  # 120 minutes of downtime are more than half of the allowance (7 200 s of 13 392 s, 53.76 %):
  # the warning fires for api only, the critical alert does not. Before the second hour of
  # downtime is over (60 minutes, 3 660 s) nothing fires. The availability of the month so far is
  # 1 - 7200 / 14400 = 50 %, and 100 % for the name that never failed.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x59 0x119 1x200"
      - series: 'probe_success{job="blackbox", environment="prod", host="ui.example.test", instance="https://ui.example.test/"}'
        values: "1x300"
    alert_rule_test:
      - eval_time: 2h
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []
      - eval_time: 4h
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: 53.76% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
      - eval_time: 4h
        alertname: SlaAvailabilityBreached
        exp_alerts: []
    promql_expr_test:
      - expr: round(sla:downtime_seconds:month)
        eval_time: 2h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 3660
          - labels: '{environment="prod", host="ui.example.test"}'
            value: 0
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 7200
          - labels: '{environment="prod", host="ui.example.test"}'
            value: 0
      - expr: round(1000 * sla:availability_ratio:month)
        eval_time: 4h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 500
          - labels: '{environment="prod", host="ui.example.test"}'
            value: 1000

  # 240 minutes of downtime exhaust the allowance: the critical alert fires and the warning
  # resolves, as with the monthly LLM budget. After 4 hours api has spent 10 860 s (81 %): the
  # warning only.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x59 0x239 1x100"
    alert_rule_test:
      - eval_time: 4h
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: 81.09% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
      - eval_time: 4h
        alertname: SlaAvailabilityBreached
        exp_alerts: []
      - eval_time: 6h
        alertname: SlaAvailabilityBreached
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: the monthly downtime allowance is spent (107.5%)"
              description: "Prod downtime of this month so far has reached the allowance of 0.5 % (availability 99.5 %); the alert stays until the month ends (docs/MONITORING.md §12)."
      - eval_time: 6h
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []

  # Inside an hour the completed hours and the 5-minute steps of the current hour add up: api
  # fails from minute 59 (probes in minutes 59 to 259 fail). Every failed probe up to the latest
  # 5-minute step counts 60 s: at 2h25m the probes of minutes 59 to 145 are 87, 5 220 s; the step
  # is 5 minutes, so 2h27m reads the same, and 2h30m adds 5 probes (92, 5 520 s). At 2h59m the
  # probes of minutes 59 to 175 are 117, 7 020 s, 52.42 % of the allowance: the warning fires
  # before the hour is over, which the completed hours alone (3 720 s) would not show.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x58 0x200"
    alert_rule_test:
      - eval_time: 2h25m
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []
      - eval_time: 2h59m
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: 52.42% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
    promql_expr_test:
      - expr: round(sla:downtime_seconds:month)
        eval_time: 2h25m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 5220
      - expr: round(sla:downtime_seconds:month)
        eval_time: 2h27m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 5220
      - expr: round(sla:downtime_seconds:month)
        eval_time: 2h30m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 5520
      - expr: round(sla:downtime_seconds:month)
        eval_time: 3h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 7320

  # The window is the calendar month (UTC): the timeline starts on 31 January 1970 at 20:00, one
  # hour of probes per 60 samples, and crosses into February (28 days, so the allowance is
  # 0.005 * 86 400 * 28 = 12 096 s, not the 13 392 s of a month of 31 days). api fails from
  # minute 1 to minute 240, which is 20:01 to 00:00 on 1 February: the hour that ends at 00:00 on
  # the 1st belongs to January. In January, the 210 failed probes of 23:30 are 12 600 s (94.09 %,
  # warning) and the 230 of 23:50 are 13 800 s (critical alert). From 00:00 on none of them counts:
  # the downtime is 0 and both alerts are gone. It is up in minutes 241 to 269 and fails in
  # minutes 270 to 299 (00:30 to 00:59): 1 probe, 60 s, at 00:30; 26 up to the 5-minute step of
  # 00:55, 1 560 s; 30, 1 800 s, once the hour is over. The availability of February at 01:00 is
  # 1 - 1800 / 3600 = 50 %.
  - interval: 1m
    start_timestamp: "1970-01-31T20:00:00Z"
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1 0x239 1x28 0x29 1x120"
    alert_rule_test:
      - eval_time: 3h30m
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: 94.09% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
      - eval_time: 3h30m
        alertname: SlaAvailabilityBreached
        exp_alerts: []
      - eval_time: 3h50m
        alertname: SlaAvailabilityBreached
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              host: api.example.test
            exp_annotations:
              summary: "api.example.test: the monthly downtime allowance is spent (103%)"
              description: "Prod downtime of this month so far has reached the allowance of 0.5 % (availability 99.5 %); the alert stays until the month ends (docs/MONITORING.md §12)."
      - eval_time: 4h5m
        alertname: SlaAvailabilityBreached
        exp_alerts: []
      - eval_time: 4h5m
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []
    promql_expr_test:
      - expr: sla:month_start_timestamp_seconds
        eval_time: 3h30m
        exp_samples:
          - labels: 'sla:month_start_timestamp_seconds{environment="shared"}'
            value: 0
      - expr: sla:month_start_timestamp_seconds
        eval_time: 5h
        exp_samples:
          - labels: 'sla:month_start_timestamp_seconds{environment="shared"}'
            value: 2678400
      - expr: sla:downtime_budget_seconds:month
        eval_time: 3h30m
        exp_samples:
          - labels: 'sla:downtime_budget_seconds:month{environment="prod"}'
            value: 13392
      - expr: sla:downtime_budget_seconds:month
        eval_time: 4h30m
        exp_samples:
          - labels: 'sla:downtime_budget_seconds:month{environment="prod"}'
            value: 12096
      - expr: round(sla:downtime_seconds:month)
        eval_time: 3h30m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 12600
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 0
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h5m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 0
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h30m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 60
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h59m
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 1560
      - expr: round(sla:downtime_seconds:month)
        eval_time: 5h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 1800
      - expr: round(sla:downtime_seconds:month)
        eval_time: 6h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 1800
      - expr: round(1000 * sla:availability_ratio:month)
        eval_time: 5h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 500

  # The thresholds of the two availability alerts, on the share of the allowance spent: exactly
  # half is not more than half (silent), exactly the whole allowance is the critical alert and no
  # longer the warning. The shares are fed as they are: with probes, a downtime of exactly 6 696 s
  # or 13 392 s cannot be built (the allowance is no multiple of a probe window and the share of
  # failed probes in a window is a float), so the probe cases below bracket the half.
  - interval: 1m
    input_series:
      - series: 'sla:downtime_budget_spent:ratio{environment="prod", host="half.example.test"}'
        values: "0.5x10"
      - series: 'sla:downtime_budget_spent:ratio{environment="prod", host="above-half.example.test"}'
        values: "0.5001x10"
      - series: 'sla:downtime_budget_spent:ratio{environment="prod", host="below-whole.example.test"}'
        values: "0.9999x10"
      - series: 'sla:downtime_budget_spent:ratio{environment="prod", host="whole.example.test"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: above-half.example.test
            exp_annotations:
              summary: "above-half.example.test: 50.01% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
          - exp_labels:
              severity: warning
              environment: prod
              host: below-whole.example.test
            exp_annotations:
              summary: "below-whole.example.test: 99.99% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
      - eval_time: 5m
        alertname: SlaAvailabilityBreached
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              host: whole.example.test
            exp_annotations:
              summary: "whole.example.test: the monthly downtime allowance is spent (100%)"
              description: "Prod downtime of this month so far has reached the allowance of 0.5 % (availability 99.5 %); the alert stays until the month ends (docs/MONITORING.md §12)."

  # Around half of the allowance of 13 392 s (6 696 s) with probes: 111 failed probes are
  # 6 660 s, silent; 112 are 6 720 s, 50.18 %, the warning.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x59 0x110 1x130"
      - series: 'probe_success{job="blackbox", environment="prod", host="ui.example.test", instance="https://ui.example.test/"}'
        values: "1x59 0x111 1x129"
    alert_rule_test:
      - eval_time: 4h
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: ui.example.test
            exp_annotations:
              summary: "ui.example.test: 50.18% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
    promql_expr_test:
      - expr: round(sla:downtime_seconds:month)
        eval_time: 4h
        exp_samples:
          - labels: '{environment="prod", host="api.example.test"}'
            value: 6660
          - labels: '{environment="prod", host="ui.example.test"}'
            value: 6720

  # A prod name that is not probed has no series and raises nothing; when it joins the probes
  # (ui in PROBE_PROD_HOSTS; its first probe is in minute 121) and fails, the same rules alert for
  # it, with no change: 180 failed probes by hour 5, 240 by hour 6. Then it
  # leaves the probes (its series ends): the critical alert resolves within the 30 minutes that the
  # rules look back for a probe sample, not at the end of the month.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", environment="prod", host="api.example.test", instance="https://api.example.test/healthcheck"}'
        values: "1x420"
      - series: 'probe_success{job="blackbox", environment="prod", host="ui.example.test", instance="https://ui.example.test/"}'
        values: "_x121 0x239 stale"
    alert_rule_test:
      - eval_time: 1h30m
        alertname: SlaAvailabilityAtRisk
        exp_alerts: []
      - eval_time: 5h
        alertname: SlaAvailabilityAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              host: ui.example.test
            exp_annotations:
              summary: "ui.example.test: 80.65% of the monthly downtime allowance is spent"
              description: "Prod downtime of this month so far (failed probes, deploy blips and maintenance included) is more than half of the allowance of 0.5 %; at 100 % SlaAvailabilityBreached takes over and this alert resolves (docs/MONITORING.md §12)."
      - eval_time: 6h
        alertname: SlaAvailabilityBreached
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              host: ui.example.test
            exp_annotations:
              summary: "ui.example.test: the monthly downtime allowance is spent (107.5%)"
              description: "Prod downtime of this month so far has reached the allowance of 0.5 % (availability 99.5 %); the alert stays until the month ends (docs/MONITORING.md §12)."
      - eval_time: 6h25m
        alertname: SlaAvailabilityBreached
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              host: ui.example.test
            exp_annotations:
              summary: "ui.example.test: the monthly downtime allowance is spent (107.5%)"
              description: "Prod downtime of this month so far has reached the allowance of 0.5 % (availability 99.5 %); the alert stays until the month ends (docs/MONITORING.md §12)."
      - eval_time: 6h35m
        alertname: SlaAvailabilityBreached
        exp_alerts: []
    promql_expr_test:
      - expr: sla:downtime_seconds:month{host="ui.example.test"}
        eval_time: 1h30m
        exp_samples: []
      - expr: sla:downtime_seconds:month{host="ui.example.test"}
        eval_time: 6h35m
        exp_samples: []

  # Time to review of the fast engine (target: p95 up to 4 minutes, SD §13). A p95 of 300 s over
  # the last hour holds for 10 minutes: the alert fires at the 10th minute, not before, and
  # resolves when the p95 is back under the target. The number of runs is not a condition.
  - interval: 1m
    input_series:
      - series: 'dmc_review_time_1h_p95_seconds{environment="prod"}'
        values: "300x40 200x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: SlaReviewTimeAtRisk
        exp_alerts: []
      - eval_time: 12m
        alertname: SlaReviewTimeAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Time to review: p95 5m 0s over the last hour, the target is 4 minutes"
              description: "The 95th percentile of the time from the creation of a fast run to its publication, over the runs that succeeded in the last hour, is above 4 minutes (docs/MONITORING.md §12)."
      - eval_time: 45m
        alertname: SlaReviewTimeAtRisk
        exp_alerts: []

  # Exactly 4 minutes meets the target; the same values in staging are not prod: neither raises
  # the alert.
  - interval: 1m
    input_series:
      - series: 'dmc_review_time_1h_p95_seconds{environment="prod"}'
        values: "240x40"
      - series: 'dmc_review_time_1h_p95_seconds{environment="staging"}'
        values: "300x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SlaReviewTimeAtRisk
        exp_alerts: []

  # One second above the 4 minutes fires.
  - interval: 1m
    input_series:
      - series: 'dmc_review_time_1h_p95_seconds{environment="prod"}'
        values: "241x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: SlaReviewTimeAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Time to review: p95 4m 1s over the last hour, the target is 4 minutes"
              description: "The 95th percentile of the time from the creation of a fast run to its publication, over the runs that succeeded in the last hour, is above 4 minutes (docs/MONITORING.md §12)."

  # A single run in the hour is enough: its p95 of 300 s fires once `for: 10m` has passed (the
  # series dmc_review_time_1h_runs plays no part in the rule; it tells an operator how many runs
  # the p95 rests on).
  - interval: 1m
    input_series:
      - series: 'dmc_review_time_1h_p95_seconds{environment="prod"}'
        values: "300x40"
      - series: 'dmc_review_time_1h_runs{environment="prod"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: SlaReviewTimeAtRisk
        exp_alerts: []
      - eval_time: 12m
        alertname: SlaReviewTimeAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Time to review: p95 5m 0s over the last hour, the target is 4 minutes"
              description: "The 95th percentile of the time from the creation of a fast run to its publication, over the runs that succeeded in the last hour, is above 4 minutes (docs/MONITORING.md §12)."

  # No run in the hour: the query returns p95 0 (coalesce), the alert stays silent.
  - interval: 1m
    input_series:
      - series: 'dmc_review_time_1h_p95_seconds{environment="prod"}'
        values: "0x40"
      - series: 'dmc_review_time_1h_runs{environment="prod"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: SlaReviewTimeAtRisk
        exp_alerts: []
