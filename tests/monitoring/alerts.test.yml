        values: "0+30x4 stale"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x5 stale"
    alert_rule_test:
      - eval_time: 7m
        alertname: WebhookWorkerDown
        exp_alerts: []
      - eval_time: 7m30s
        alertname: WebhookWorkerDown
        exp_alerts:
          - exp_labels:
