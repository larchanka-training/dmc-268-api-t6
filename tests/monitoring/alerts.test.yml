# Unit tests of deploy/monitoring/prometheus/rules/alerts.yml, run by CI (job monitoring-validate):
#   docker run --rm --entrypoint promtool -v "$PWD:/w:ro" -w /w <prometheus image> \
#     test rules tests/monitoring/alerts.test.yml
rule_files:
  - ../../deploy/monitoring/prometheus/rules/alerts.yml

evaluation_interval: 30s

tests:
  # The DoD alert path: new dead letters, a queue without its worker, a backlog. The DLQ keeps
  # its 2 messages for days; the alert fires on the growth and is gone 15 minutes later.
  - interval: 30s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{environment="staging", queue="reviews.dlq", vhost="/"}'
        values: "0 0 2x40"
      - series: 'rabbitmq_detailed_queue_consumers{environment="staging", queue="review.run.fast", vhost="/"}'
        values: "1 1 0x20"
      - series: 'rabbitmq_detailed_queue_messages_ready{environment="staging", queue="review.run.fast", vhost="/"}'
        values: "25x30"
      - series: 'rabbitmq_detailed_queue_messages_ready{environment="staging", queue="retry.30s.fast", vhost="/"}'
        values: "500x30"
    alert_rule_test:
      - eval_time: 30s
        alertname: ReviewDeadLetters
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewDeadLetters
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              kind: event
            exp_annotations:
              summary: "2 new message(s) in reviews.dlq in the last 15 minutes"
              description: "Retries exhausted, an unknown schema or an unexpected error (docs/PIPELINE_SPEC.md §4.4); the operator reads the DLQ."
      - eval_time: 17m
        alertname: ReviewDeadLetters
        exp_alerts: []
      - eval_time: 7m
        alertname: ReviewQueueWithoutConsumer
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              queue: review.run.fast
            exp_annotations:
              summary: "No worker consumes review.run.fast"
              description: "The review worker is down or detached from the broker for 5 minutes."
      # Retry queues hold messages on purpose: only review.run.* and review.publish count.
      - eval_time: 11m
        alertname: ReviewQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              queue: review.run.fast
            exp_annotations:
              summary: "25 message(s) wait in review.run.fast"
              description: "The queue has held more than 20 ready messages for 10 minutes; workers do not keep up."

  # Failed and stuck runs from the PostgreSQL review metrics.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_finished_15m_runs{environment="staging", state="succeeded"}'
        values: "4x10"
      - series: 'dmc_runs_finished_15m_runs{environment="staging", state="failed"}'
        values: "_ _ 1x8"
      - series: 'dmc_runs_active_stale_queued{environment="staging"}'
        values: "0 0 2x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: ReviewRunsFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewRunsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) failed in the last 15 minutes"
              description: "Open the runs with state failed in the portal or the Grafana dashboard for error_code."
      - eval_time: 8m
        alertname: ReviewRunsStuckInQueue
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
            exp_annotations:
              summary: "2 run(s) queued for more than 10 minutes"
              description: "Runs stay queued past available_at (T18 of docs/PIPELINE_SPEC.md §3)."

  # LLM latency needs both a slow p95 and enough calls: one slow call does not page.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_calls_15m_p95_seconds{environment="staging"}'
        values: "80x30"
      - series: 'dmc_llm_calls_15m_calls{environment="staging"}'
        values: "1x10 5x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: LlmLatencyHigh
        exp_alerts: []
      - eval_time: 21m
        alertname: LlmLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
            exp_annotations:
              summary: "LLM calls are slow: p95 1m 20s over 15 minutes"
              description: "The fast-engine call timeout is 90 s (docs/PIPELINE_SPEC.md §3)."

  # The monthly LLM budget: the spend of every database counts (neither series reaches 80% alone),
  # 79.8% is silent, 80% and 99.96% warn (two decimals: not "100.0%"), at 100% the critical fires
  # at once and the warning resolves 5 minutes later.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_monthly_budget_usd{environment="shared", instance="node-exporter:9100", job="node"}'
        values: "50x45"
      - series: 'dmc_llm_cost_month_usd{environment="staging"}'
        values: "24.9x9 25x9 29.98x9 30x15"
      - series: 'dmc_llm_cost_month_usd{environment="prod"}'
        values: "15x19 20x25"
    alert_rule_test:
      - eval_time: 9m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 14m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 15m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 40.00 USD, 80.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) is between 80% and 100% of LLM_MONTHLY_BUDGET_USD; at 100% LlmMonthlyBudgetExceeded takes over and this alert resolves; the alert pauses no reviews."
      - eval_time: 15m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []
      - eval_time: 29m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 49.98 USD, 99.96% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) is between 80% and 100% of LLM_MONTHLY_BUDGET_USD; at 100% LlmMonthlyBudgetExceeded takes over and this alert resolves; the alert pauses no reviews."
      - eval_time: 29m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []
      - eval_time: 29m30s
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []
      - eval_time: 30m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 50.00 USD, 100.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."
      - eval_time: 34m30s
        alertname: LlmMonthlyBudgetWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 49.98 USD, 99.96% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) is between 80% and 100% of LLM_MONTHLY_BUDGET_USD; at 100% LlmMonthlyBudgetExceeded takes over and this alert resolves; the alert pauses no reviews."
      - eval_time: 35m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 40m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 40m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 50.00 USD, 100.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."

  # A missed scrape of postgres-exporter marks the spend stale; neither alert resolves on it.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_monthly_budget_usd{environment="shared", instance="node-exporter:9100", job="node"}'
        values: "50x30"
      - series: 'dmc_llm_cost_month_usd{environment="staging"}'
        values: "45x10 stale 45x3 55x5 stale 55x5"
    alert_rule_test:
      - eval_time: 11m30s
        alertname: LlmMonthlyBudgetWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 45.00 USD, 90.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) is between 80% and 100% of LLM_MONTHLY_BUDGET_USD; at 100% LlmMonthlyBudgetExceeded takes over and this alert resolves; the alert pauses no reviews."
      - eval_time: 22m30s
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 55.00 USD, 110.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."

  # An outage of postgres-exporter (TargetDown reports it): the critical holds for 30 minutes, so a
  # 20-minute gap sends no RESOLVED, and a longer one resolves it 30 minutes after the last scrape.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_monthly_budget_usd{environment="shared", instance="node-exporter:9100", job="node"}'
        values: "50x65"
      - series: 'dmc_llm_cost_month_usd{environment="staging"}'
        values: "55x5 stale _x19 55x5 stale"
    alert_rule_test:
      - eval_time: 16m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 55.00 USD, 110.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."
      - eval_time: 25m30s
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 55.00 USD, 110.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."
      - eval_time: 61m30s
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 55.00 USD, 110.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."
      - eval_time: 62m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []

  # The month rolls over (the 1st, 00:00 UTC) and the spend starts again near 0: the critical
  # resolves 30 minutes later.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_monthly_budget_usd{environment="shared", instance="node-exporter:9100", job="node"}'
        values: "50x40"
      - series: 'dmc_llm_cost_month_usd{environment="staging"}'
        values: "55x5 0.5x35"
    alert_rule_test:
      - eval_time: 35m30s
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
            exp_annotations:
              summary: "LLM spend this month: 55.00 USD, 110.00% of the monthly budget"
              description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."
      - eval_time: 36m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []

  # No budget is set: no threshold series, then a 0 written by hand. Both alerts stay silent.
  - interval: 1m
    input_series:
      - series: 'dmc_llm_monthly_budget_usd{environment="shared", instance="node-exporter:9100", job="node"}'
        values: "_x14 0x15"
      - series: 'dmc_llm_cost_month_usd{environment="staging"}'
        values: "500x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 14m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []
      - eval_time: 30m
        alertname: LlmMonthlyBudgetWarning
        exp_alerts: []
      - eval_time: 30m
        alertname: LlmMonthlyBudgetExceeded
        exp_alerts: []

  # Runs skipped by the daily budget of a workspace: an event, gone 1 hour after the window
  # empties.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_budget_paused_15m_runs{environment="staging"}'
        values: "0 0 2x5 0x70"
    alert_rule_test:
      - eval_time: 1m
        alertname: ReviewRunsBudgetPaused
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "2 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 7m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "2 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 67m30s
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "2 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 68m
        alertname: ReviewRunsBudgetPaused
        exp_alerts: []

  # A single skipped run is enough.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_budget_paused_15m_runs{environment="staging"}'
        values: "0 1x5 0x70"
    alert_rule_test:
      - eval_time: 0m
        alertname: ReviewRunsBudgetPaused
        exp_alerts: []
      - eval_time: 1m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 67m
        alertname: ReviewRunsBudgetPaused
        exp_alerts: []

  # Pushes into a paused workspace every 20 minutes: the window empties between the skips, yet the
  # alert stays firing (one message, not one per skip) and is gone 1 hour after the last skip
  # leaves the window.
  - interval: 1m
    input_series:
      - series: 'dmc_runs_budget_paused_15m_runs{environment="staging"}'
        values: "1x14 0x4 1x14 0x4 1x14 0x65"
    alert_rule_test:
      - eval_time: 0m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 17m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 37m
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 114m30s
        alertname: ReviewRunsBudgetPaused
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: staging
              kind: event
            exp_annotations:
              summary: "1 review run(s) skipped with budget_paused in the last 15 minutes"
              description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."
      - eval_time: 115m
        alertname: ReviewRunsBudgetPaused
        exp_alerts: []

  # 5xx share per host, with a minimum of traffic; the metrics endpoint of Caddy (host _other) and
  # other hosts do not count.
  - interval: 1m
    input_series:
      - series: 'caddy_http_request_duration_seconds_count{environment="staging", host="staging-api.example.test", code="200"}'
        values: "0+60x20"
      - series: 'caddy_http_request_duration_seconds_count{environment="staging", host="staging-api.example.test", code="502"}'
        values: "0+12x20"
      - series: 'caddy_http_request_duration_seconds_count{environment="prod", host="api.example.test", code="503"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiHigh5xxRate
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              host: staging-api.example.test
            exp_annotations:
              summary: "staging-api.example.test: 16.67% of requests end in 5xx"
              description: "More than 5% of requests to staging-api.example.test returned 5xx for 5 minutes."

  - interval: 1m
    input_series:
      - series: 'up{environment="staging", job="rabbitmq", instance="rabbitmq:15692"}'
        values: "1 1 0x10"
      - series: 'node_memory_MemAvailable_bytes{environment="shared", instance="node-exporter:9100"}'
        values: "50x20"
      - series: 'node_memory_MemTotal_bytes{environment="shared", instance="node-exporter:9100"}'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: staging
              job: rabbitmq
              instance: rabbitmq:15692
            exp_annotations:
              summary: "Scrape target rabbitmq (rabbitmq:15692) is down"
              description: "Prometheus has not reached rabbitmq for 5 minutes."
      - eval_time: 11m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: shared
              instance: node-exporter:9100
            exp_annotations:
              summary: "Host memory available: 5%"
              description: "Less than 10% of the VPS memory has been available for 10 minutes."

  # External probes: a name that fails for 5 minutes pages without any Caddy series (no traffic
  # needed); a name down 4.5 minutes at a time, then answering once, does not.
  - interval: 1m
    input_series:
      - series: 'probe_success{environment="prod", job="blackbox", instance="https://api.example.test/healthcheck", host="api.example.test"}'
        values: "1 0x10"
      - series: 'probe_success{environment="staging", job="blackbox", instance="https://staging-ui.example.test/health", host="staging-ui.example.test"}'
        values: "1 0x4 1 0x4 1"
    alert_rule_test:
      - eval_time: 5m30s
        alertname: PublicEndpointDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "api.example.test is down from outside"
              description: "The HTTPS probe of https://api.example.test/healthcheck has failed for 5 minutes: a connection or TLS error or a non-2xx answer, the 503 stub included."
      - eval_time: 7m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
              job: blackbox
              instance: https://api.example.test/healthcheck
              host: api.example.test
            exp_annotations:
              summary: "api.example.test is down from outside"
              description: "The HTTPS probe of https://api.example.test/healthcheck has failed for 5 minutes: a connection or TLS error or a non-2xx answer, the 503 stub included."

  # webhook-worker unhealthy (health 0) from 1m pages at 6m, per project: staging and prod alike.
  # A container without a healthcheck (-1, dmc-268-api) and the projects of other apps do not.
  - interval: 30s
    input_series:
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "1 1 0x20"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-staging-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "0+30x22"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-staging", container_label_com_docker_compose_service="postgres", name="dmc-268-api-staging-postgres-1"}'
        values: "1x22"
      - series: 'container_health_state{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "1 1 0x20"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-prod-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{environment="prod", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api-prod", container_label_com_docker_compose_service="postgres", name="dmc-268-api-prod-postgres-1"}'
        values: "0+30x22"
      - series: 'container_health_state{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "-1x22"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="webhook-worker", name="dmc-268-api-webhook-worker-1"}'
        values: "0+30x22"
      - series: 'container_last_seen{environment="staging", job="cadvisor", container_label_com_docker_compose_project="dmc-268-api", container_label_com_docker_compose_service="postgres", name="dmc-268-api-postgres-1"}'
        values: "0+30x22"
