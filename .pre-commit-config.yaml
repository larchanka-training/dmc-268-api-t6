repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Dataset patches and raw provider answers must retain their exact bytes.
        exclude: ^test-prs-dataset/(?:.*\.patch|responses/(?!manifest\.json$)[^/]+\.json)$
      - id: end-of-file-fixer
        # Preserve generated SVG, dataset patches and raw provider answers byte-for-byte.
        exclude: ^(?:docs/erd/erd\.svg|test-prs-dataset/(?:.*\.patch|responses/(?!manifest\.json$)[^/]+\.json))$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Same commands as the CI job "Python lint / type / test", so both check the same files.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
