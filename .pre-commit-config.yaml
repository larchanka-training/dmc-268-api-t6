repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Prompt wire goldens, dataset patches, raw answers and the oracle's rendered prompts retain their exact bytes.
        exclude: ^(?:tests/fixtures/prompt_builder/[^/]+\.txt|test-prs-dataset/(?:.*\.patch|responses/(?!manifest\.json$)[^/]+\.json)|test-prs-dataset/rag/oracle/context/[^/]+\.txt)$
      - id: end-of-file-fixer
        # Preserve generated SVG, prompt wire goldens, patches, raw answers and the oracle's rendered prompts byte-for-byte.
        exclude: ^(?:docs/erd/erd\.svg|tests/fixtures/prompt_builder/[^/]+\.txt|test-prs-dataset/(?:.*\.patch|responses/(?!manifest\.json$)[^/]+\.json)|test-prs-dataset/rag/oracle/context/[^/]+\.txt)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Same commands as the CI job "Python lint / type / unit", so both check the same files.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
