repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Rendered from docs/erd/erd.mmd; a manual fix would be lost on the next render.
        exclude: ^docs/erd/erd\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Same commands as the CI job "Python lint / type / test", so both check the same files.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
