repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: check-yaml
        files: ^backend/
      - id: check-toml
        files: ^backend/
      - id: check-merge-conflict
        files: ^backend/

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: sh -c 'cd backend && uv run ruff check --fix .'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: sh -c 'cd backend && uv run ruff format .'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: sh -c 'cd backend && uv run mypy .'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
