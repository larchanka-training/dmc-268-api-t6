name: LLM live run

# Manual live check of the LLM gateway on EUrouter (#33, OQ-2 / D7 in docs/SYSTEM_DESIGN.md §15).
# Not part of the required checks: those run without network and keys. The org secret
# AI_DMC268_T6 is used only here; GitHub masks it in the log, the gateway never logs keys.
# This manual job fetches ECB FX over outbound HTTPS from data-api.ecb.europa.eu.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Primary model
        default: mistral-small-4
      fallback_model:
        description: Fallback model
        default: mistral-small-3.2-24b
      diff:
        description: Unified diff to review
        default: review/examples/sample.diff

permissions:
  contents: read

concurrency:
  group: llm-live-run
  cancel-in-progress: false

jobs:
  live-run:
    name: LLM live run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model }}
      FALLBACK_MODEL: ${{ inputs.fallback_model }}
      DIFF: ${{ inputs.diff }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      - name: uv sync
        run: uv sync --locked --all-groups

      - name: Primary with fallback
        id: primary
        continue-on-error: true
        shell: bash
        env:
          LLM_API_KEYS: ${{ secrets.AI_DMC268_T6 }}
        run: |
          set -o pipefail
          LLM_MODEL="$MODEL" LLM_FALLBACK_MODEL="$FALLBACK_MODEL" \
            uv run python -m app.bootstrap.llm_gateway "$DIFF" > primary.json

      - name: Fallback as the primary, without a fallback
        id: fallback
        continue-on-error: true
        shell: bash
        env:
          LLM_API_KEYS: ${{ secrets.AI_DMC268_T6 }}
        run: |
          set -o pipefail
          LLM_MODEL="$FALLBACK_MODEL" \
            uv run python -m app.bootstrap.llm_gateway "$DIFF" > fallback.json

      # D7 holds for a run only when its single call is the primary and the answer is valid:
      # a repair, a retry or a fallback means strict json_schema was not confirmed.
      - name: Validate and summarize
        if: always()
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            echo "## LLM live run"
            echo
            echo "| Run | Provider | Model (\`model\` of the answer) | Calls | FX quote per call | Tokens in / out / cache | Cost, \$ | Time, ms | Validator |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for run in primary fallback; do
            if [[ ! -s "$run.json" ]]; then
              echo "| $run | — | — | — | — | — | — | — | no output |" >> "$GITHUB_STEP_SUMMARY"
              status=1
              continue
            fi
            if jq -e '.output' "$run.json" > /dev/null; then
              jq '.output' "$run.json" > "$run.output.json"
              if ! verdict="$(uv run python review/scripts/validate_findings.py "$run.output.json" 2>&1 | tail -n 1)"; then
                status=1
              fi
              if ! jq -e '[.calls[].kind] == ["primary"]' "$run.json" > /dev/null; then
                verdict="$verdict; D7 not confirmed: calls $(jq -c '[.calls[].kind]' "$run.json")"
                status=1
              fi
            else
              verdict="$(jq -r '"failed: " + .error_code' "$run.json")"
              status=1
            fi
            jq -r --arg run "$run" --arg verdict "$verdict" \
              'def md_cell:
                tostring | @html
                | gsub("\\\\"; "&#92;") | gsub("\\|"; "&#124;")
                | gsub("`"; "&#96;") | gsub("\\*"; "&#42;") | gsub("_"; "&#95;")
                | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;")
                | gsub("\\("; "&#40;") | gsub("\\)"; "&#41;")
                | gsub("!"; "&#33;") | gsub("~"; "&#126;") | gsub(":"; "&#58;")
                | gsub("\r\n|\r|\n"; "<br>");
              def call_summary:
                [.calls[]? | (.kind | md_cell) +
                  (if .error then
                    " (" + (.error.class | md_cell) + " " +
                    ((.error.http_status // "") | md_cell) + ")"
                  else "" end)] | join(", ");
              def fx_calls:
                [.calls[]? | (.kind | md_cell) + "#" + (.call_no | md_cell) + ": " +
                  (if .fx then
                    (.fx.source | md_cell) + " " + (.fx.observation_date | md_cell) + " " +
                    (.fx.rate_usd_per_eur | md_cell) +
                    " USD/EUR (" + (if .fx.stale_cache then "stale cache" else "fresh" end) + ")"
                  else "—" end)] |
                if length == 0 then "—" else join("<br>") end;
              "| \($run | md_cell) | \((.provider // "—") | md_cell) | \((.model // "—") | md_cell) | \(call_summary) | \(fx_calls) | \(.tokens_in | md_cell) / \(.tokens_out | md_cell) / \(.cache_read_tokens | md_cell) | \(.cost_usd | md_cell) | \((.latency_ms // "—") | md_cell) | \($verdict | md_cell) |"' \
              "$run.json" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-live-run
          path: |
            primary.json
            fallback.json
          if-no-files-found: warn
