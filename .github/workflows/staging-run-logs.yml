name: Staging run logs

# Read-only lookup of the JSON log lines of one review run on staging (#395 AC4): for a `run_id`,
# the lines of the `api`, `worker` and `webhook-worker` containers of the staging project that carry
# it as the `run_id` field (docs/MONITORING.md section 11). Nobody on the team has SSH to the course
# VPS, and the lines appear only after the run, so a deploy run cannot carry them. The job changes
# nothing on the host, takes no VPS lock and needs no approval.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id (UUID of the run, as the run page and the API show it)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lookup:
    name: Look up the run log lines
    # workflow_dispatch can target any branch; only main may use the VPS credentials (organization
    # secrets, readable from any branch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the run id
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # One UUID and nothing else: the id is matched against the log as a fixed string and
          # printed into the step summary.
          if [[ ! "${RUN_ID}" =~ ^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::run_id must be one UUID (the id of the run)" >&2
            exit 1
          fi

      - name: Resolve the course VPS target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Prod runs only on the shared course VPS (password auth, port 22, API behind the edge proxy
          # as api-prod). Only non-secret values go to the step outputs. This job has no Environment,
          # so STAGING_HOST comes from the repository or the organization, never from Environment
          # staging. Staging runs on the same VPS while STAGING_HOST is unset (ci-cd.yml), and the
          # lookup uses only host and port: one target serves both stacks.
          if [[ -n "${STAGING_HOST}" ]]; then
            echo "prod deploy targets the course VPS only; GitHub variable STAGING_HOST (Terraform host) is set" >&2
            exit 1
          fi
          if [[ -z "${VPS_HOST}" || "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
            echo "Course VPS target needs organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P" >&2
            exit 1
          fi
          host="${VPS_HOST}"
          port=22
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "prod host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          if [[ ! "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
            echo "Course VPS target needs repository variable APP_DOMAIN (base domain of the edge proxy routes)" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the course VPS host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          app_dir=/opt/dmc-268-api-prod
          edge_alias=api-prod
          base_url="https://api.${APP_DOMAIN}"
          health_url="${base_url}/healthcheck"
          # One key=value line per output: a CR/LF inside a value could otherwise append lines that
          # override host or port.
          for value in "${host}" "${port}" "${app_dir}" "${edge_alias}" "${base_url}" "${health_url}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "prod target values must be single-line" >&2
              exit 1
            fi
          done
          {
            echo "host=${host}"
            echo "port=${port}"
            echo "app_dir=${app_dir}"
            echo "edge_alias=${edge_alias}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "prod target: course VPS (${host}:${port}, ${base_url})"

      - name: Read the run log lines
        id: lookup
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ secrets.VPS_DMC268_U }}
          password: ${{ secrets.VPS_DMC268_P }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          envs: RUN_ID
          script: |
            set -euo pipefail
            set +o xtrace
            # Checked again on the host: the id is never interpreted, only matched as a fixed string.
            if [[ ! "${RUN_ID}" =~ ^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$ ]]; then
              echo "run_id must be one UUID" >&2
              exit 1
            fi
            # The app writes the id in lowercase.
            run_id="${RUN_ID,,}"
            # deploy.sh names the compose project after its app dir, /opt/dmc-268-api-staging.
            project="dmc-268-api-staging"
            # Records, one per line, tab-separated, for the next step (the SSH action appends its
            # own banner, so that step keeps only these):
            #   CONTAINERS <service> <count>               containers of the service
            #   STAT <service> <json> <non-json> <match>   per container: lines in the window
            #   LINE <service> <line>                      the first 5 matching lines per container
            # A line is a match only when it is a JSON log record (it starts with the `ts` key the
            # formatter writes first) holding the `run_id` field as the formatter serializes it.
            # json.dumps escapes the quotes inside a string value, so a message cannot pose as the
            # field. Nothing else is ever printed: the other lines of `api` (uvicorn access log) may
            # carry query strings, so they are only counted.
            total=0
            for service in api worker webhook-worker; do
              ids="$(docker ps -aq --no-trunc --filter "label=com.docker.compose.project=${project}" --filter "label=com.docker.compose.service=${service}")"
              count=0
              if [[ -n "${ids}" ]]; then
                while read -r id; do
                  count=$((count + 1))
                  # docker logs puts the container's stderr (the JSON log) on stderr. A failing
                  # docker logs or awk must not look like an empty result.
                  codes=(0 0)
                  docker logs --since 168h "${id}" 2>&1 | awk -v service="${service}" -v needle="\"run_id\": \"${run_id}\"" '
                    { sub(/\r$/, "") }
                    index($0, "{\"ts\": \"") == 1 {
                      json++
                      if (index($0, needle) > 0) {
                        found++
                        if (found <= 5) printf "LINE\t%s\t%s\n", service, substr($0, 1, 400)
                      }
                      next
                    }
                    { raw++ }
                    END { printf "STAT\t%s\t%d\t%d\t%d\n", service, json, raw, found }
                  ' || codes=("${PIPESTATUS[@]}")
                  if [[ "${codes[0]}" -ne 0 ]]; then
                    echo "docker logs failed (exit ${codes[0]}) for container ${id}" >&2
                    exit 1
                  fi
                  if [[ "${codes[1]}" -ne 0 ]]; then
                    echo "filter failed (exit ${codes[1]}) on the log of container ${id}" >&2
                    exit 1
                  fi
                done <<< "${ids}"
              fi
              printf 'CONTAINERS\t%s\t%d\n' "${service}" "${count}"
              total=$((total + count))
            done
            if [[ "${total}" -eq 0 ]]; then
              echo "no api, worker or webhook-worker container in ${project}" >&2
              exit 1
            fi

      - name: Show the run log lines
        env:
          RUN_ID: ${{ inputs.run_id }}
          LOOKUP_STDOUT: ${{ steps.lookup.outputs.stdout }}
        run: |
          # The SSH action appends its own banner to stdout: only the records of the host script
          # are read. Backticks are dropped so log text cannot close the code fence of the summary,
          # and a line is cut again. At most 5 lines per service are shown, from the first
          # containers; the counts cover all of them.
          # shellcheck disable=SC2016  # Markdown code spans and fence, not shell
          summary="$(printf '%s\n' "${LOOKUP_STDOUT}" | tr -d '`\r' | awk -F'\t' -v run_id="${RUN_ID,,}" '
            BEGIN { n = split("api worker webhook-worker", order, " ") }
            $1 == "CONTAINERS" { seen[$2] = 1; containers[$2] += $3 }
            $1 == "STAT" { json[$2] += $3; raw[$2] += $4; found[$2] += $5 }
            $1 == "LINE" && shown[$2] < 5 { shown[$2]++; text[$2] = text[$2] substr($3, 1, 300) "\n" }
            END {
              for (i = 1; i <= n; i++) {
                if (!(order[i] in seen)) {
                  print "no lookup output for " order[i] " (the host script did not finish)" > "/dev/stderr"
                  exit 1
                }
              }
              fence = "```"
              printf "### Staging run logs\n\n- Run: `%s`\n", run_id
              print "- Window: the last 168 h of each container'"'"'s log; a container recreated by a later deploy has lost its log\n"
              print "| Service | Containers | JSON lines | Non-JSON lines | Lines with this `run_id` |"
              print "|---|---:|---:|---:|---:|"
              for (i = 1; i <= n; i++) {
                s = order[i]
                printf "| %s | %d | %d | %d | %d |\n", s, containers[s], json[s], raw[s], found[s]
              }
              for (i = 1; i <= n; i++) {
                s = order[i]
                if (containers[s] == 0) printf "\n- No `%s` container in `dmc-268-api-staging`: nothing was read\n", s
              }
              for (i = 1; i <= n; i++) {
                s = order[i]
                if (found[s] == 0) continue
                note = found[s] == 1 ? "1 line" : found[s] " lines"
                if (found[s] > shown[s]) note = note ", the first " shown[s] " shown"
                printf "\n#### %s: %s\n\n%stext\n%s%s\n", s, note, fence, text[s], fence
              }
            }
          ')"
          printf '%s\n' "${summary}" >> "${GITHUB_STEP_SUMMARY}"
