name: Markdown links

# Relative links and anchors in the tracked Markdown of docs/, .agents/, AGENTS.md and
# test-prs-dataset/README.md must resolve (#270). Every pull request, without a paths filter:
# moving or deleting any file can break a link to it. The script is a SYNC copy from
# dmc-268-ui-t6 (.agents/README.md § Sync map). Not a required check of ruleset `main`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  md-links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      # The script is stdlib only: --no-project runs it without syncing the project environment.
      - name: Check relative links
        run: uv run --no-project python .github/scripts/check_md_links.py
