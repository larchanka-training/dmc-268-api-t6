name: Live corpus evaluation

# Manual, paid evaluation using the team EUrouter account. Required CI uses the committed offline replay.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Primary EUrouter model (empty uses LLM_MODEL variable)"
        required: false
        type: string
      export_raw_responses:
        description: "Export raw first answers and manifest for baseline publication"
        required: false
        type: boolean
        default: false
      corpus:
        description: "Corpus: main (gold benchmark) or rules (rules.md sub-corpus, #163)"
        required: false
        type: choice
        options:
          - main
          - rules
        default: main
      policy_arm:
        description: "Policy arm: legacy (no policy snapshot), none, valid or malicious"
        required: false
        type: choice
        options:
          - legacy
          - none
          - valid
          - malicious
        default: legacy
      review_prompt:
        description: "Review prompt: v3, or v4 or v5 (snapshot path: needs policy_arm none, or valid or malicious with corpus rules)"
        required: false
        type: choice
        options:
          - v3
          - v4
          - v5
        default: v3

permissions:
  contents: read

concurrency:
  group: eval-live-eurouter
  cancel-in-progress: false

jobs:
  evaluate:
    name: Live corpus evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: eurouter
      LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
      LLM_STRUCTURED_OUTPUT: json_schema
      # Inputs reach the shell only through these variables, never as expressions in run.
      EVAL_CORPUS: ${{ inputs.corpus || 'main' }}
      EVAL_POLICY_ARM: ${{ inputs.policy_arm || 'legacy' }}
      EVAL_REVIEW_PROMPT: ${{ inputs.review_prompt || 'v3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Prepare isolated corpus
        shell: bash
        run: |
          case "$EVAL_CORPUS" in
            main) cases=test-prs-dataset/cases ;;
            rules) cases=test-prs-dataset/rules/cases ;;
            *) echo "::error::Unknown corpus: $EVAL_CORPUS" >&2; exit 1 ;;
          esac
          mkdir "$RUNNER_TEMP/eval-corpus"
          cp -R "$cases" test-prs-dataset/schema "$RUNNER_TEMP/eval-corpus/"

      - name: Validate corpus
        shell: bash
        run: |
          profile=()
          if [[ "$EVAL_CORPUS" == rules ]]; then
            if [[ "$EVAL_POLICY_ARM" == legacy ]]; then
              echo "::error::corpus rules needs policy_arm none, valid or malicious; legacy shows no repository rules." >&2
              exit 1
            fi
            profile=(--profile rules)
          fi
          uv run python review/scripts/validate_dataset.py --root "$RUNNER_TEMP/eval-corpus" --final "${profile[@]}"

      - name: Evaluate live corpus
        shell: bash
        env:
          LLM_API_KEYS: ${{ secrets.AI_DMC268_T6 }}
        run: |
          if [[ -z "$LLM_API_KEYS" ]]; then
            echo "::error::Make the AI_DMC268_T6 organization secret available to this repository before dispatch." >&2
            exit 1
          fi
          uv run python review/scripts/eval_live.py \
            --root "$RUNNER_TEMP/eval-corpus" \
            --system "review/prompts/review.system.$EVAL_REVIEW_PROMPT.md" \
            --policy-arm "$EVAL_POLICY_ARM" \
            --report-json "$RUNNER_TEMP/eval-report.json" \
            --redacted-responses "$RUNNER_TEMP/eval-response-metadata"

      - name: Export safe provenance
        if: always()
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/eval-corpus/responses/manifest.json"
          if [[ -f "$manifest" ]]; then
            mkdir -p "$RUNNER_TEMP/eval-response-metadata"
            cp "$manifest" "$RUNNER_TEMP/eval-response-metadata/manifest.json"
          fi

      - name: Summarize evaluation
        if: always()
        shell: bash
        run: |
          uv run python - <<'PYTHON'
          import html
          import json
          import os
          from pathlib import Path

          from review.scripts.eval_replay import format_console

          report_path = Path(os.environ["RUNNER_TEMP"]) / "eval-report.json"
          prompt = html.escape(os.environ["EVAL_REVIEW_PROMPT"])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Live corpus evaluation\n\n")
              summary.write(f"Review prompt: {prompt}\n\n")
              if report_path.is_file():
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  summary.write("<pre>" + html.escape(format_console(report)) + "</pre>\n")
              else:
                  summary.write("No evaluation report was produced. See the failed step for details.\n")
          PYTHON

      # Export metrics and per-case hashes/statuses, not raw model text or diagnostics.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-${{ env.EVAL_CORPUS }}-${{ env.EVAL_POLICY_ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eval-report.json
            ${{ runner.temp }}/eval-response-metadata/
          if-no-files-found: warn
          retention-days: 14

      - name: Stage raw responses
        id: raw_export
        if: ${{ always() && inputs.export_raw_responses }}
        shell: bash
        run: |
          uv run python - <<'PYTHON'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          responses = root / "eval-corpus/responses"
          manifest = responses / "manifest.json"
          if responses.is_symlink() or manifest.is_symlink():
              raise SystemExit("Raw capture must not use symlinks")
          mapping = json.loads(manifest.read_text(encoding="utf-8"))["responses"]
          case_ids = {path.parent.name for path in (root / "eval-corpus/cases").glob("*/case.json")}
          expected = {case_id: f"responses/{case_id}.json" for case_id in case_ids}
          if not expected or mapping != expected:
              raise SystemExit("Raw capture must map exactly to the evaluated cases")
          sources = [manifest, *(responses / f"{case_id}.json" for case_id in sorted(case_ids))]
          if any(path.is_symlink() or not path.is_file() for path in sources):
              raise SystemExit("Raw capture files must be regular files without symlinks")
          export = root / "eval-raw-responses"
          export.mkdir()
          for source in sources:
              shutil.copyfile(source, export / source.name)
          PYTHON

      - name: Upload raw responses
        if: ${{ always() && inputs.export_raw_responses && steps.raw_export.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-raw-${{ env.EVAL_CORPUS }}-${{ env.EVAL_POLICY_ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-raw-responses/
          if-no-files-found: error
          retention-days: 14
