name: Live corpus evaluation

# Manual, paid evaluation using the team EUrouter account. Required CI uses the committed offline replay.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Primary EUrouter model (empty uses LLM_MODEL variable)"
        required: false
        type: string
      export_raw_responses:
        description: "Export raw first answers and manifest for baseline publication"
        required: false
        type: boolean
        default: false
      corpus:
        description: "Corpus: main, rules, rag or verifier (#217)"
        required: false
        type: choice
        options:
          - main
          - rules
          - rag
          - verifier
        default: main
      rag_arm:
        description: "RAG arm, corpus rag only: none (arm A, no retrieved block) or graph (arm B)"
        required: false
        type: choice
        options:
          - none
          - graph
        default: none
      policy_arm:
        description: "Policy arm: legacy (no policy snapshot), none, valid or malicious (corpus rag needs none)"
        required: false
        type: choice
        options:
          - legacy
          - none
          - valid
          - malicious
        default: legacy
      review_prompt:
        description: "Review prompt: v3, or v4, v5 or v7 (snapshot path: needs policy_arm none, or valid or malicious with corpus rules; corpus rag needs v5 or v7)"
        required: false
        type: choice
        options:
          - v3
          - v4
          - v5
          - v7
        default: v3
      review_prompt_file:
        description: "Review prompt file for an A/B of prompt versions: directly in review/prompts/, with key review.system; overrides review_prompt (not with corpus rag)"
        required: false
        type: string
      verifier_model:
        description: "Approved verifier primary model (must match configured route)"
        required: false
        type: string
      verifier_fallback_model:
        description: "Approved verifier fallback model, or none"
        required: false
        type: string
      verifier_stop_threshold_usd:
        description: "Approved verifier cost stop threshold in USD"
        required: false
        type: string
      verifier_approved_overrun_usd:
        description: "Approved verifier overrun allowance in USD"
        required: false
        type: string
      verifier_window_end:
        description: "Approved verifier window end, ISO 8601 with timezone"
        required: false
        type: string
      verifier_approval_ref:
        description: "Issue comment recording model, window and budget approval"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eval-live-eurouter
  cancel-in-progress: false

jobs:
  evaluate:
    name: Live corpus evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: eurouter
      LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
      LLM_STRUCTURED_OUTPUT: json_schema
      # Inputs reach the shell only through these variables, never as expressions in run.
      EVAL_CORPUS: ${{ inputs.corpus || 'main' }}
      EVAL_POLICY_ARM: ${{ inputs.policy_arm || 'legacy' }}
      EVAL_REVIEW_PROMPT: ${{ inputs.review_prompt || 'v3' }}
      EVAL_REVIEW_PROMPT_FILE: ${{ inputs.review_prompt_file }}
      EVAL_REVIEW_MODEL_INPUT: ${{ inputs.model }}
      EVAL_EXPORT_RAW_RESPONSES: ${{ inputs.export_raw_responses }}
      EVAL_RAG_ARM: ${{ inputs.rag_arm || 'none' }}
      EVAL_VERIFIER_MODEL: ${{ inputs.verifier_model }}
      EVAL_VERIFIER_FALLBACK_MODEL: ${{ inputs.verifier_fallback_model }}
      EVAL_VERIFIER_STOP_THRESHOLD_USD: ${{ inputs.verifier_stop_threshold_usd }}
      EVAL_VERIFIER_APPROVED_OVERRUN_USD: ${{ inputs.verifier_approved_overrun_usd }}
      EVAL_VERIFIER_WINDOW_END: ${{ inputs.verifier_window_end }}
      EVAL_VERIFIER_APPROVAL_REF: ${{ inputs.verifier_approval_ref }}
      # Artifact-name part: the policy arm, and for corpus rag (policy arm always none) policy-ragarm,
      # so the arm A and arm B captures of one corpus never share a name.
      EVAL_ARTIFACT_ARM: ${{ (inputs.corpus == 'rag' && format('{0}-{1}', inputs.policy_arm, inputs.rag_arm)) || inputs.policy_arm || 'legacy' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate verifier dispatch
        if: ${{ inputs.corpus == 'verifier' }}
        shell: bash
        run: |
          if [[ -n "${EVAL_REVIEW_MODEL_INPUT:-}" ||
                "${EVAL_EXPORT_RAW_RESPONSES:-false}" != false ||
                "${EVAL_POLICY_ARM:-legacy}" != legacy ||
                "${EVAL_RAG_ARM:-none}" != none ||
                "${EVAL_REVIEW_PROMPT:-v3}" != v3 ||
                -n "${EVAL_REVIEW_PROMPT_FILE:-}" ]]; then
            echo "::error::verifier dispatch rejects reviewer options and raw export." >&2
            exit 1
          fi
          for name in EVAL_VERIFIER_MODEL EVAL_VERIFIER_FALLBACK_MODEL \
                      EVAL_VERIFIER_STOP_THRESHOLD_USD EVAL_VERIFIER_APPROVED_OVERRUN_USD \
                      EVAL_VERIFIER_WINDOW_END EVAL_VERIFIER_APPROVAL_REF; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::verifier dispatch requires six approved values." >&2
              exit 1
            fi
          done

      - name: Validate review prompt file
        if: ${{ inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          # Only a checked-in review.system prompt reaches --system (#317). The input is free text:
          # no error below quotes it, so it cannot forge a workflow command.
          file="${EVAL_REVIEW_PROMPT_FILE:-}"
          if [[ -z "$file" ]]; then
            exit 0
          fi
          # The guard of the corpus step reads review_prompt only: a RAG run names its prompt there.
          if [[ "${EVAL_CORPUS:-}" == rag ]]; then
            echo "::error::corpus rag takes its prompt from review_prompt; leave review_prompt_file empty." >&2
            exit 1
          fi
          if [[ ! "$file" =~ ^review/prompts/[A-Za-z0-9][A-Za-z0-9._-]*\.md$ ]]; then
            echo "::error::review_prompt_file must name a file directly in review/prompts/." >&2
            exit 1
          fi
          if [[ -L "$file" || ! -f "$file" ]]; then
            echo "::error::review_prompt_file must be a regular file of the selected ref." >&2
            exit 1
          fi
          key="$(awk 'NR == 1 { if ($0 != "---") exit; next } $0 == "---" { exit } /^key: / { print substr($0, 6); exit }' "$file")"
          if [[ "$key" != review.system ]]; then
            echo "::error::review_prompt_file must be a prompt with key review.system." >&2
            exit 1
          fi

      - name: Prepare isolated corpus
        if: ${{ inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          case "$EVAL_CORPUS" in
            main) cases=test-prs-dataset/cases ;;
            rules) cases=test-prs-dataset/rules/cases ;;
            # Whole case directories (case.json, diff.patch, index.json, base/): the synthetic
            # commit ids of a RAG case derive from its cases/<ID> name.
            rag) cases=test-prs-dataset/rag/cases ;;
            *) echo "::error::Unknown corpus: $EVAL_CORPUS" >&2; exit 1 ;;
          esac
          mkdir "$RUNNER_TEMP/eval-corpus"
          cp -R "$cases" test-prs-dataset/schema "$RUNNER_TEMP/eval-corpus/"

      - name: Validate corpus
        if: ${{ inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          profile=()
          if [[ "$EVAL_CORPUS" == rules ]]; then
            if [[ "$EVAL_POLICY_ARM" == legacy ]]; then
              echo "::error::corpus rules needs policy_arm none, valid or malicious; legacy shows no repository rules." >&2
              exit 1
            fi
            profile=(--profile rules)
          elif [[ "$EVAL_CORPUS" == rag ]]; then
            # The offline RAG build needs a prompt with a retrieved section (v5, v7) under policy
            # arm none; eval_live.py refuses anything else too, but only after the corpus is
            # provisioned.
            if [[ ! "${EVAL_RAG_ARM:-}" =~ ^(none|graph)$ ]]; then
              echo "::error::corpus rag needs rag_arm none or graph." >&2
              exit 1
            fi
            if [[ "$EVAL_POLICY_ARM" != none ]]; then
              echo "::error::corpus rag needs policy_arm none." >&2
              exit 1
            fi
            if [[ ! "${EVAL_REVIEW_PROMPT:-}" =~ ^(v5|v7)$ ]]; then
              echo "::error::corpus rag needs review_prompt v5 or v7." >&2
              exit 1
            fi
            profile=(--profile rag)
          fi
          if [[ "$EVAL_CORPUS" != rag && "${EVAL_RAG_ARM:-none}" != none ]]; then
            echo "::error::rag_arm ${EVAL_RAG_ARM} needs corpus rag, not $EVAL_CORPUS." >&2
            exit 1
          fi
          uv run python review/scripts/validate_dataset.py --root "$RUNNER_TEMP/eval-corpus" --final "${profile[@]}"

      - name: Evaluate live corpus
        if: ${{ inputs.corpus != 'verifier' }}
        shell: bash
        env:
          LLM_API_KEYS: ${{ secrets.AI_DMC268_T6 }}
        run: |
          if [[ -z "$LLM_API_KEYS" ]]; then
            echo "::error::Make the AI_DMC268_T6 organization secret available to this repository before dispatch." >&2
            exit 1
          fi
          rag=()
          if [[ "${EVAL_CORPUS:-}" == rag ]]; then
            rag=(--rag-arm "$EVAL_RAG_ARM")
          fi
          system="review/prompts/review.system.$EVAL_REVIEW_PROMPT.md"
          if [[ -n "${EVAL_REVIEW_PROMPT_FILE:-}" ]]; then
            system="$EVAL_REVIEW_PROMPT_FILE"
          fi
          uv run python review/scripts/eval_live.py \
            --root "$RUNNER_TEMP/eval-corpus" \
            --system "$system" \
            --policy-arm "$EVAL_POLICY_ARM" \
            "${rag[@]}" \
            --report-json "$RUNNER_TEMP/eval-report.json" \
            --redacted-responses "$RUNNER_TEMP/eval-response-metadata"

      - name: Evaluate verifier corpus
        if: ${{ inputs.corpus == 'verifier' }}
        shell: bash
        env:
          LLM_VERIFIER_MODEL: ${{ vars.LLM_VERIFIER_MODEL }}
          LLM_VERIFIER_FALLBACK_MODEL: ${{ vars.LLM_VERIFIER_FALLBACK_MODEL }}
          LLM_API_KEYS: ${{ secrets.AI_DMC268_T6 }}
        run: |
          if [[ -z "$LLM_API_KEYS" ]]; then
            echo "::error::Make the AI_DMC268_T6 organization secret available before dispatch." >&2
            exit 1
          fi
          uv run python -m review.scripts.eval_verifier \
            --allow-paid \
            --corpus "test-prs-dataset/verifier/v1/cases.json" \
            --output "$RUNNER_TEMP/verifier-report.json" \
            --model "$EVAL_VERIFIER_MODEL" \
            --fallback-model "$EVAL_VERIFIER_FALLBACK_MODEL" \
            --stop-threshold-usd "$EVAL_VERIFIER_STOP_THRESHOLD_USD" \
            --approved-overrun-usd "$EVAL_VERIFIER_APPROVED_OVERRUN_USD" \
            --window-end "$EVAL_VERIFIER_WINDOW_END" \
            --approval-ref "$EVAL_VERIFIER_APPROVAL_REF"

      - name: Export safe provenance
        if: ${{ always() && inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/eval-corpus/responses/manifest.json"
          if [[ -f "$manifest" ]]; then
            mkdir -p "$RUNNER_TEMP/eval-response-metadata"
            cp "$manifest" "$RUNNER_TEMP/eval-response-metadata/manifest.json"
          fi

      - name: Summarize evaluation
        if: ${{ always() && inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          uv run python - <<'PYTHON'
          import html
          import json
          import os
          from pathlib import Path

          from review.scripts.eval_replay import format_console

          report_path = Path(os.environ["RUNNER_TEMP"]) / "eval-report.json"
          prompt = html.escape(
              os.environ.get("EVAL_REVIEW_PROMPT_FILE") or os.environ["EVAL_REVIEW_PROMPT"]
          )
          corpus = html.escape(os.environ["EVAL_CORPUS"])
          rag_arm = html.escape(os.environ["EVAL_RAG_ARM"] if corpus == "rag" else "n/a")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Live corpus evaluation\n\n")
              summary.write(f"Review prompt: {prompt}\n\n")
              summary.write(f"Corpus: {corpus}\n\n")
              summary.write(f"RAG arm: {rag_arm}\n\n")
              if report_path.is_file():
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  summary.write("<pre>" + html.escape(format_console(report)) + "</pre>\n")
              else:
                  summary.write("No evaluation report was produced. See the failed step for details.\n")
          PYTHON

      # Export metrics and per-case hashes/statuses, not raw model text or diagnostics.
      - name: Upload evaluation report
        if: ${{ always() && inputs.corpus != 'verifier' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-${{ env.EVAL_CORPUS }}-${{ env.EVAL_ARTIFACT_ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eval-report.json
            ${{ runner.temp }}/eval-response-metadata/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verifier evaluation report
        if: ${{ always() && inputs.corpus == 'verifier' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stage raw responses
        id: raw_export
        if: ${{ always() && inputs.export_raw_responses && inputs.corpus != 'verifier' }}
        shell: bash
        run: |
          uv run python - <<'PYTHON'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          responses = root / "eval-corpus/responses"
          manifest = responses / "manifest.json"
          if responses.is_symlink() or manifest.is_symlink():
              raise SystemExit("Raw capture must not use symlinks")
          mapping = json.loads(manifest.read_text(encoding="utf-8"))["responses"]
          case_ids = {path.parent.name for path in (root / "eval-corpus/cases").glob("*/case.json")}
          expected = {case_id: f"responses/{case_id}.json" for case_id in case_ids}
          if not expected or mapping != expected:
              raise SystemExit("Raw capture must map exactly to the evaluated cases")
          sources = [manifest, *(responses / f"{case_id}.json" for case_id in sorted(case_ids))]
          if any(path.is_symlink() or not path.is_file() for path in sources):
              raise SystemExit("Raw capture files must be regular files without symlinks")
          export = root / "eval-raw-responses"
          export.mkdir()
          for source in sources:
              shutil.copyfile(source, export / source.name)
          PYTHON

      - name: Upload raw responses
        if: ${{ always() && inputs.export_raw_responses && inputs.corpus != 'verifier' && steps.raw_export.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-raw-${{ env.EVAL_CORPUS }}-${{ env.EVAL_ARTIFACT_ARM }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-raw-responses/
          if-no-files-found: error
          retention-days: 14
