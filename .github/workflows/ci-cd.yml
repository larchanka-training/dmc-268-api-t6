name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  LOCAL_IMAGE: dmc-268-api:ci

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /src --config /src/.gitleaks.toml --no-banner --redact --exit-code 1

  terraform-fmt-validate:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff -recursive terraform/

      - name: terraform init and validate
        run: |
          for stack in terraform/api-staging terraform/ui-staging; do
            echo "=== ${stack} ==="
            terraform -chdir="${stack}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="${stack}" validate -no-color
          done

  terraform-lint-security:
    name: Terraform lint / security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          config_file: .checkov.yaml
          directory: .
          output_format: cli
          soft_fail: false

      - name: Checkov custom policies fail on the bad fixture
        shell: bash
        run: |
          # Same image the pinned checkov-action (v12.3125.0) runs. Started from /tmp so .checkov.yaml (quiet, skip-path) is not auto-loaded.
          report="$(docker run --rm -v "$PWD:/repo:ro" -w /tmp ghcr.io/bridgecrewio/checkov:3.3.19 \
            -d /repo/.checkov/fixtures/bad --framework terraform \
            --external-checks-dir /repo/.checkov/policies \
            --check CKV2_HCLOUD_1,CKV2_HCLOUD_2,CKV2_HCLOUD_3 -o json || true)"
          failed="$(jq -r '.results.failed_checks[].check_id' <<< "${report}" | sort -u)" || {
            echo "Checkov produced no usable JSON report for .checkov/fixtures/bad" >&2
            exit 1
          }
          missing=0
          for id in CKV2_HCLOUD_1 CKV2_HCLOUD_2 CKV2_HCLOUD_3; do
            if grep -qx "${id}" <<< "${failed}"; then
              echo "${id}: FAILED on the bad fixture as expected"
            else
              echo "${id} did not report FAILED on .checkov/fixtures/bad; the policy is broken" >&2
              missing=1
            fi
          done
          exit "${missing}"

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      immutable: ${{ steps.meta.outputs.immutable }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "immutable=${image}:${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Export image artifact
        run: docker save "${LOCAL_IMAGE}" | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  docker-scan:
    name: Docker image security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          scanners: vuln,secret,misconfig

  push-image:
    name: Push Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    needs:
      - secret-scan
      - terraform-fmt-validate
      - terraform-lint-security
      - docker-build
      - docker-scan
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      staging: ${{ needs.docker-build.outputs.staging }}
      previous: ${{ needs.docker-build.outputs.previous }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Set tags
        id: tags
        run: |
          echo "immutable=${{ needs.docker-build.outputs.immutable }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push scanned image
        id: push
        run: |
          gunzip -c docker-image.tar.gz | docker load
          immutable="${{ steps.tags.outputs.immutable }}"
          docker tag "${LOCAL_IMAGE}" "${immutable}"
          docker push "${immutable}"
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${immutable}")"
          if [[ -z "${image_ref}" || "${image_ref}" == "<no value>" ]]; then
            echo "failed to resolve pushed image digest for ${immutable}" >&2
            exit 1
          fi
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${image_ref} (commit ${{ github.sha }})"

  deploy-staging:
    name: Deploy staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: push-image
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      promote: ${{ steps.result.outputs.promote }}
      image_ref: ${{ needs.push-image.outputs.image_ref }}
      staging: ${{ needs.push-image.outputs.staging }}
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth) when STAGING_HOST is set, otherwise the shared course VPS
          # (password auth, port 22). Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          base_url="http://${host}"
          health_url="${base_url}/healthcheck"
          if [[ "${mode}" == "terraform" && -n "${STAGING_HEALTH_URL}" ]]; then
            health_url="${STAGING_HEALTH_URL}"
          fi
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          source: "deploy/compose/staging.yml,deploy/scripts/deploy.sh,deploy/scripts/rollback.sh,deploy/scripts/healthcheck.sh,deploy/scripts/env-file.sh"
          target: /opt/dmc-268-api
          strip_components: 2

      - name: Deploy image
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.push-image.outputs.image_ref }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          script: |
            set -euo pipefail
            set +o xtrace
            mv /opt/dmc-268-api/staging.yml /opt/dmc-268-api/compose.yml
            chmod +x /opt/dmc-268-api/deploy.sh /opt/dmc-268-api/rollback.sh /opt/dmc-268-api/healthcheck.sh /opt/dmc-268-api/env-file.sh
            /opt/dmc-268-api/deploy.sh "${IMAGE}"

      - name: Health check
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          chmod +x deploy/scripts/healthcheck.sh
          deploy/scripts/healthcheck.sh "${HEALTH_URL}"

      - name: Rollback on failed deploy or health check
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            set +o xtrace
            ROLLBACK_MODE=auto /opt/dmc-268-api/rollback.sh

      - name: Set promote flag
        id: result
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" && "${{ steps.health.outcome }}" == "success" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fail the pipeline after rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            echo "staging deploy failed; rollback was triggered"
          else
            echo "staging health check failed; rollback was triggered"
          fi
          if [[ "${{ steps.rollback.outcome }}" == "failure" ]]; then
            echo "rollback failed" >&2
            exit 1
          fi
          exit 1

  promote-staging:
    name: Promote staging tag
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy-staging.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - push-image
      - deploy-staging
    # Same lock as deploy-staging and the rollback workflow: a manual rollback cannot run
    # between the VM check below and the tag push.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # Terraform SSH host, port and key are scoped to the staging environment.
    environment:
      name: staging
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth) when STAGING_HOST is set, otherwise the shared course VPS
          # (password auth, port 22). Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          base_url="http://${host}"
          health_url="${base_url}/healthcheck"
          if [[ "${mode}" == "terraform" && -n "${STAGING_HEALTH_URL}" ]]; then
            health_url="${STAGING_HEALTH_URL}"
          fi
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port})"

      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          script: |
            state=/opt/dmc-268-api/.deploy-state
            if [[ -f "${state}" ]]; then
              awk -F= '/^current_image=/{print $2; exit}' "${state}"
            else
              echo bootstrap
            fi

      - name: Check staging still runs this digest
        id: guard
        env:
          DEPLOYED_STDOUT: ${{ steps.deployed.outputs.stdout }}
          EXPECTED_IMAGE: ${{ needs.deploy-staging.outputs.image_ref }}
        run: |
          # drone-ssh appends its own success banner; the first line is the script output.
          running="$(printf '%s\n' "${DEPLOYED_STDOUT}" | head -n 1 | tr -d '\r')"
          if [[ -n "${EXPECTED_IMAGE}" && "${running}" == "${EXPECTED_IMAGE}" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
            echo "staging still runs ${running}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::staging runs '${running:-<empty>}', not ${EXPECTED_IMAGE}: a rollback ran after this deploy, skipping promotion"
          fi

      - name: Promote scanned digest to staging
        if: steps.guard.outputs.promote == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          image_ref="${{ needs.deploy-staging.outputs.image_ref }}"
          staging="${{ needs.push-image.outputs.staging }}"
          previous="${{ needs.push-image.outputs.previous }}"
          docker pull "${image_ref}"
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          else
            echo "no existing staging image; skip previous-tag"
          fi
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
          echo "promoted ${image_ref} to ${staging}"
