name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  LOCAL_IMAGE: dmc-268-api:ci

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /src --config /src/.gitleaks.toml --no-banner --redact --exit-code 1

  terraform-fmt-validate:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff -recursive terraform/

      - name: terraform init and validate
        run: |
          for stack in terraform/api-staging terraform/ui-staging; do
            echo "=== ${stack} ==="
            terraform -chdir="${stack}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="${stack}" validate -no-color
          done

  terraform-lint-security:
    name: Terraform lint / security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          config_file: .checkov.yaml
          directory: .
          output_format: cli
          soft_fail: false

      - name: Checkov custom policies fail on the bad fixture
        shell: bash
        run: |
          # Same image the pinned checkov-action (v12.3125.0) runs. Started from /tmp so .checkov.yaml (quiet, skip-path) is not auto-loaded.
          report="$(docker run --rm -v "$PWD:/repo:ro" -w /tmp ghcr.io/bridgecrewio/checkov:3.3.19 \
            -d /repo/.checkov/fixtures/bad --framework terraform \
            --external-checks-dir /repo/.checkov/policies \
            --check CKV2_HCLOUD_1,CKV2_HCLOUD_2,CKV2_HCLOUD_3 -o json || true)"
          failed="$(jq -r '.results.failed_checks[].check_id' <<< "${report}" | sort -u)" || {
            echo "Checkov produced no usable JSON report for .checkov/fixtures/bad" >&2
            exit 1
          }
          missing=0
          for id in CKV2_HCLOUD_1 CKV2_HCLOUD_2 CKV2_HCLOUD_3; do
            if grep -qx "${id}" <<< "${failed}"; then
              echo "${id}: FAILED on the bad fixture as expected"
            else
              echo "${id} did not report FAILED on .checkov/fixtures/bad; the policy is broken" >&2
              missing=1
            fi
          done
          exit "${missing}"

  python-lint-type-test:
    # The name is a required status check on main; keep it verbatim.
    name: Python lint / type / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
      RABBITMQ_URL: amqp://ci:ci@127.0.0.1:5672/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      - name: uv sync
        run: uv sync --locked --all-groups

      - name: Check integration services
        run: |
          uv run python - <<'PYTHON'
          import os
          import socket
          from urllib.parse import urlsplit

          import psycopg
          from sqlalchemy.engine import make_url

          database = make_url(os.environ["TEST_DATABASE_URL"])
          with psycopg.connect(
              host=database.host,
              port=database.port,
              dbname=database.database,
              user=database.username,
              password=database.password,
              connect_timeout=5,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  assert cursor.fetchone() == (1,)

          rabbitmq = urlsplit(os.environ["RABBITMQ_URL"])
          with socket.create_connection((rabbitmq.hostname or "", rabbitmq.port or 5672), timeout=5) as connection:
              connection.sendall(b"AMQP\x00\x00\x09\x01")
              assert connection.recv(1) == b"\x01", "RabbitMQ did not answer the AMQP handshake"
          print("PostgreSQL and RabbitMQ ready")
          PYTHON

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        # ReviewOutput schema and the gateway's answer parse path: 100% lines and branches (#33).
        run: >-
          uv run pytest
          --cov=app.modules.reviews.application.review_output
          --cov=app.modules.reviews.infrastructure.llm.answers
          --cov-branch --cov-fail-under=100 --cov-report=term-missing
          -W error::coverage.exceptions.CoverageWarning

      - name: Gold corpus and recorded replay
        shell: bash
        run: |
          corpus_report="${RUNNER_TEMP}/corpus-report.json"
          replay_report="${RUNNER_TEMP}/replay-report.json"
          uv run python review/scripts/validate_dataset.py --final --report-json "${corpus_report}"
          if [[ -f test-prs-dataset/responses/manifest.json ]]; then
            uv run python review/scripts/eval_replay.py --report-json "${replay_report}"
          fi
          CORPUS_REPORT="${corpus_report}" REPLAY_REPORT="${replay_report}" uv run python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path(os.environ["CORPUS_REPORT"]).read_text(encoding="utf-8"))
          replay_path = Path(os.environ["REPLAY_REPORT"])

          def percent(value):
              return "undefined" if value is None else f"{value * 100:.1f}%"

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Gold benchmark\n\n")
              summary.write(
                  f"Corpus: {corpus['valid_case_count']}/{corpus['case_count']} valid; "
                  f"distribution {'passed' if corpus['passed'] else 'failed'}.\n\n"
              )
              if replay_path.is_file():
                  replay = json.loads(replay_path.read_text(encoding="utf-8"))
                  summary.write(
                      f"Recorded replay ({replay['provenance']['model_id']}): "
                      f"Validity {percent(replay['validity'])}, "
                      f"micro Precision {percent(replay['micro']['precision'])}, "
                      f"micro Recall {percent(replay['micro']['recall'])}, "
                      f"Critical Recall {percent(replay['critical']['recall'])}.\n"
                  )
                  for warning in replay["warnings"]:
                      print(f"::warning::{warning}")
                      summary.write(f"\n> [!WARNING]\n> {warning}\n")
              else:
                  summary.write("Recorded replay: pending baseline responses and manifest.\n")
          PYTHON

      - name: Integration suite (zero skips)
        run: |
          report="${RUNNER_TEMP}/integration-results.xml"
          uv run pytest -m integration -q -rs --junitxml="${report}"
          INTEGRATION_REPORT="${report}" uv run python - <<'PYTHON'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(os.environ["INTEGRATION_REPORT"]).getroot()
          cases = root.findall(".//testcase")
          skipped = [
              case.attrib.get("name", "<unnamed>")
              for case in cases
              if (outcome := case.find("skipped")) is not None
              and outcome.attrib.get("type") != "pytest.xfail"
          ]
          print(f"Integration tests: {len(cases)} collected, {len(skipped)} skipped")
          if not cases or skipped:
              for name in skipped:
                  print(f"::error::Integration test skipped: {name}")
              raise SystemExit("Integration suite must contain tests and have zero skips")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"Integration tests: {len(cases)} collected, 0 skipped\n")
          PYTHON

  openapi-lint:
    # The name is a required status check on main; keep it verbatim.
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Redocly lint
        # docs/PIPELINE_SPEC.md §16; the same command as locally. The repo-root redocly.yaml
        # (extends recommended-strict: every warning is an error) and .redocly.lint-ignore.yaml apply.
        # The runner's preinstalled Node satisfies the CLI's engines (>=22.12).
        run: npx --yes @redocly/cli@2.57.0 lint contracts/openapi.yaml

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      immutable: ${{ steps.meta.outputs.immutable }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image coordinates
        id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "immutable=${image}:${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke-test packaged review artifacts
        run: |
          docker run --rm "${LOCAL_IMAGE}" python -c '
          from importlib.resources import files
          from pathlib import Path
          from app.modules.repositories.application.onboard_repository import load_default_rule_sets
          from app.modules.reviews.application.findings_post_processor import FindingsPostProcessor
          assert files("review.postprocess").joinpath("lint-filter-patterns.json").is_file()
          FindingsPostProcessor.from_default_patterns()
          assert set(load_default_rule_sets(Path("review/rules"))) == {"backend", "frontend"}
          '

      - name: Export image artifact
        run: docker save "${LOCAL_IMAGE}" | gzip > /tmp/docker-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  docker-scan:
    name: Docker image security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          scanners: vuln,secret,misconfig

  webhook-smoke:
    # The name is a required status check on main; keep it verbatim.
    name: Webhook container smoke
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
    steps:
      # Checkout first: its clean step would delete the downloaded artifact.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: Generate a throwaway webhook secret
        # Never a repository or environment secret: the image is unpublished at this point.
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::${secret}"
          echo "GITHUB_WEBHOOK_SECRET=${secret}" >> "${GITHUB_ENV}"

      - name: Migrate the database with the built image
        run: docker run --rm --network host -e DATABASE_URL "${LOCAL_IMAGE}" alembic upgrade head

      - name: Start the API container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL -e GITHUB_WEBHOOK_SECRET "${LOCAL_IMAGE}"

      - name: Wait for the API healthcheck
        run: deploy/scripts/healthcheck.sh http://127.0.0.1:8000/healthcheck

      - name: Signed webhook smoke
        run: python3 scripts/webhook_smoke.py --url http://127.0.0.1:8000/webhooks/github --count 50

      - name: API container logs
        if: failure()
        run: docker logs api || true

  push-image:
    name: Push Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    # Nothing reaches the registry or staging unless every job below is green.
    needs:
      - secret-scan
      - terraform-fmt-validate
      - terraform-lint-security
      - python-lint-type-test
      - openapi-lint
      - docker-build
      - docker-scan
      - webhook-smoke
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      staging: ${{ needs.docker-build.outputs.staging }}
      previous: ${{ needs.docker-build.outputs.previous }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Set tags
        id: tags
        run: |
          echo "immutable=${{ needs.docker-build.outputs.immutable }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push scanned image
        id: push
        run: |
          gunzip -c docker-image.tar.gz | docker load
          immutable="${{ steps.tags.outputs.immutable }}"
          docker tag "${LOCAL_IMAGE}" "${immutable}"
          docker push "${immutable}"
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${immutable}")"
          if [[ -z "${image_ref}" || "${image_ref}" == "<no value>" ]]; then
            echo "failed to resolve pushed image digest for ${immutable}" >&2
            exit 1
          fi
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "pushed ${image_ref} (commit ${{ github.sha }})"

  deploy-staging:
    name: Deploy staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: push-image
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      promote: ${{ steps.result.outputs.promote }}
      image_ref: ${{ needs.push-image.outputs.image_ref }}
      staging: ${{ needs.push-image.outputs.staging }}
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth, API on host port 80) when STAGING_HOST is set, otherwise
          # the shared course VPS (password auth, port 22, API behind the edge proxy as api-staging).
          # Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-api
            deploy_mode=ports
            edge_alias=""
            base_url="http://${host}"
            health_url="${STAGING_HEALTH_URL:-${base_url}/healthcheck}"
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
            if [[ ! "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
              echo "Course VPS target needs repository variable APP_DOMAIN (base domain of the edge proxy routes)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-api-staging
            deploy_mode=edge
            edge_alias=api-staging
            base_url="https://staging-api.${APP_DOMAIN}"
            health_url="${base_url}/healthcheck"
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          # One key=value line per output: a CR/LF inside a value (e.g. from STAGING_HEALTH_URL) could
          # otherwise append lines that override mode, host or port.
          for value in "${mode}" "${host}" "${port}" "${app_dir}" "${deploy_mode}" "${edge_alias}" "${base_url}" "${health_url}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "staging target values must be single-line" >&2
              exit 1
            fi
          done
          for url in "${base_url}" "${health_url}"; do
            if [[ ! "${url}" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "staging URL '${url}' must be http(s)://<host>[/path] without whitespace" >&2
              exit 1
            fi
          done
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "app_dir=${app_dir}"
            echo "deploy_mode=${deploy_mode}"
            echo "edge_alias=${edge_alias}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port}, ${base_url})"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          source: "deploy/compose/staging.yml,deploy/compose/staging.ports.yml,deploy/compose/staging.edge.yml,deploy/scripts/provision.sh,deploy/scripts/deploy.sh,deploy/scripts/rollback.sh,deploy/scripts/healthcheck.sh,deploy/scripts/env-file.sh"
          target: ${{ steps.target.outputs.app_dir }}
          strip_components: 2

      - name: Upload edge proxy files
        if: steps.target.outputs.deploy_mode == 'edge'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          source: "deploy/edge/compose.yml,deploy/edge/Caddyfile"
          target: /opt/dmc-268-edge
          strip_components: 2

      - name: Prepare host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          EDGE_NETWORK: ${{ steps.target.outputs.deploy_mode == 'edge' && 'dmc268-edge' || '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: APP_DIR,EDGE_NETWORK,APP_DOMAIN
          script: |
            set -euo pipefail
            set +o xtrace
            cd "${APP_DIR}"
            mv staging.yml compose.yml
            mv staging.ports.yml compose.ports.yml
            mv staging.edge.yml compose.edge.yml
            chmod +x provision.sh deploy.sh rollback.sh healthcheck.sh env-file.sh
            ./provision.sh
            if [[ -n "${EDGE_NETWORK}" ]]; then
              # Only the API repo deploys the edge proxy on the course VPS; refreshed on every run.
              edge=(docker compose -p dmc-268-edge -f /opt/dmc-268-edge/compose.yml)
              "${edge[@]}" up -d --wait --wait-timeout 120
              "${edge[@]}" exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            fi

      - name: Wait for the edge certificate
        if: steps.target.outputs.deploy_mode == 'edge'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          # On a first run Let's Encrypt issues certificates for every edge host, which can outlast the
          # health check window; a failed health check would trigger an automatic rollback. Wait here,
          # before any app change, until the TLS handshake succeeds (any HTTP status, 502 included).
          deadline=$((SECONDS + 180))
          until curl -s -o /dev/null --max-time 10 "${BASE_URL}/"; do
            if (( SECONDS >= deadline )); then
              echo "no valid TLS certificate for ${BASE_URL} after 180 s; check DNS and the edge proxy logs" >&2
              curl -sS -o /dev/null --max-time 10 "${BASE_URL}/" || true
              exit 1
            fi
            sleep 5
          done
          echo "TLS handshake with ${BASE_URL} succeeded"

      - name: Bundle application secrets
        id: app_secrets
        shell: bash
        env:
          # Environment staging secrets (docs/SECRETS.md). GitHub rejects secret names starting with
          # GITHUB_, so the App secrets are GH_* here and GITHUB_* in the container.
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.AUTH_JWT_PRIVATE_KEY }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.AUTH_JWT_PUBLIC_KEY }}
        run: |
          # One opaque line of base64 so multi-line PEM values survive the SSH action and the shell;
          # deploy/scripts/env-file.sh decodes it on the host. Unset secrets are left out entirely.
          names=(GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_WEBHOOK_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET AUTH_JWT_PRIVATE_KEY AUTH_JWT_PUBLIC_KEY)
          bundle="$(
            for name in "${names[@]}"; do
              if [[ -n "${!name}" ]]; then
                printf '%s=%s\n' "${name}" "$(printf '%s' "${!name}" | base64 | tr -d '\n')"
              fi
            done | base64 | tr -d '\n'
          )"
          if [[ -n "${bundle}" ]]; then
            echo "::add-mask::${bundle}"
          fi
          echo "bundle=${bundle}" >> "${GITHUB_OUTPUT}"
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] && echo "set: ${name}" || echo "not set: ${name}"
          done

      - name: Deploy image
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.push-image.outputs.image_ref }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          DEPLOY_MODE: ${{ steps.target.outputs.deploy_mode }}
          EDGE_ALIAS: ${{ steps.target.outputs.edge_alias }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          APP_SECRETS_B64: ${{ steps.app_secrets.outputs.bundle }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,APP_DIR,DEPLOY_MODE,EDGE_ALIAS,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,APP_SECRETS_B64
          script: |
            set -euo pipefail
            set +o xtrace
            "${APP_DIR}/deploy.sh" "${IMAGE}"

      - name: Health check
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          chmod +x deploy/scripts/healthcheck.sh
          deploy/scripts/healthcheck.sh "${HEALTH_URL}"

      - name: Rollback on failed deploy or health check
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          DEPLOY_MODE: ${{ steps.target.outputs.deploy_mode }}
          EDGE_ALIAS: ${{ steps.target.outputs.edge_alias }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,APP_DIR,DEPLOY_MODE,EDGE_ALIAS
          script: |
            set -euo pipefail
            set +o xtrace
            ROLLBACK_MODE=auto "${APP_DIR}/rollback.sh"

      - name: Set promote flag
        id: result
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" && "${{ steps.health.outcome }}" == "success" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fail the pipeline after rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            echo "staging deploy failed; rollback was triggered"
          else
            echo "staging health check failed; rollback was triggered"
          fi
          if [[ "${{ steps.rollback.outcome }}" == "failure" ]]; then
            echo "rollback failed" >&2
            exit 1
          fi
          exit 1

  promote-staging:
    name: Promote staging tag
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy-staging.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - push-image
      - deploy-staging
    # Same lock as deploy-staging and the rollback workflow: a manual rollback cannot run
    # between the VM check below and the tag push.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    # Terraform SSH host, port and key are scoped to the staging environment.
    environment:
      name: staging
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth, API on host port 80) when STAGING_HOST is set, otherwise
          # the shared course VPS (password auth, port 22, API behind the edge proxy as api-staging).
          # Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-api
            deploy_mode=ports
            edge_alias=""
            base_url="http://${host}"
            health_url="${STAGING_HEALTH_URL:-${base_url}/healthcheck}"
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
            if [[ ! "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
              echo "Course VPS target needs repository variable APP_DOMAIN (base domain of the edge proxy routes)" >&2
              exit 1
            fi
            app_dir=/opt/dmc-268-api-staging
            deploy_mode=edge
            edge_alias=api-staging
            base_url="https://staging-api.${APP_DOMAIN}"
            health_url="${base_url}/healthcheck"
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          # One key=value line per output: a CR/LF inside a value (e.g. from STAGING_HEALTH_URL) could
          # otherwise append lines that override mode, host or port.
          for value in "${mode}" "${host}" "${port}" "${app_dir}" "${deploy_mode}" "${edge_alias}" "${base_url}" "${health_url}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "staging target values must be single-line" >&2
              exit 1
            fi
          done
          for url in "${base_url}" "${health_url}"; do
            if [[ ! "${url}" =~ ^https?://[^[:space:]]+$ ]]; then
              echo "staging URL '${url}' must be http(s)://<host>[/path] without whitespace" >&2
              exit 1
            fi
          done
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "app_dir=${app_dir}"
            echo "deploy_mode=${deploy_mode}"
            echo "edge_alias=${edge_alias}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port}, ${base_url})"

      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          envs: APP_DIR
          script: |
            state="${APP_DIR}/.deploy-state"
            if [[ -f "${state}" ]]; then
              awk -F= '/^current_image=/{print $2; exit}' "${state}"
            else
              echo bootstrap
            fi

      - name: Check staging still runs this digest
        id: guard
        env:
          DEPLOYED_STDOUT: ${{ steps.deployed.outputs.stdout }}
          EXPECTED_IMAGE: ${{ needs.deploy-staging.outputs.image_ref }}
        run: |
          # drone-ssh appends its own success banner; the first line is the script output.
          running="$(printf '%s\n' "${DEPLOYED_STDOUT}" | head -n 1 | tr -d '\r')"
          if [[ -n "${EXPECTED_IMAGE}" && "${running}" == "${EXPECTED_IMAGE}" ]]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
            echo "staging still runs ${running}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::staging runs '${running:-<empty>}', not ${EXPECTED_IMAGE}: a rollback ran after this deploy, skipping promotion"
          fi

      - name: Promote scanned digest to staging
        if: steps.guard.outputs.promote == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          image_ref="${{ needs.deploy-staging.outputs.image_ref }}"
          staging="${{ needs.push-image.outputs.staging }}"
          previous="${{ needs.push-image.outputs.previous }}"
          docker pull "${image_ref}"
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          else
            echo "no existing staging image; skip previous-tag"
          fi
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
          echo "promoted ${image_ref} to ${staging}"
