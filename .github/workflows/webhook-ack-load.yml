name: Webhook ACK load (staging)

# Manual load test of the staging webhook ACK against SD §13 (p95 < 500 ms, internal goal
# 200 ms), #163. It sends signed `ping` deliveries without `installation`: each one is stored as
# a receipt and ends as ignored_irrelevant_event, so no Run, GitHub or LLM call follows, and the
# receipts are purged after 30 days. The caps and the script's fail-fast protect the VPS that
# staging shares with production; dispatch only inside a window agreed in the issue (`window`).
on:
  workflow_dispatch:
    inputs:
      window:
        description: "Agreed load window, approver and issue/comment link (one line, at most 300 characters)"
        required: true
        type: string
      count:
        description: "Timed deliveries, 1-1000 (plus one warm-up delivery per connection)"
        required: false
        type: string
        default: "200"
      concurrency:
        description: "Requests in flight, 1-10"
        required: false
        type: string
        default: "5"
      body_bytes:
        description: "JSON body size in bytes, 64-65536"
        required: false
        type: string
        default: "16384"

permissions:
  contents: read

# Main-only lock, as in rollback.yml: a dispatch from another branch gets a throwaway group, so it
# cannot replace a pending main run before its job is skipped.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'webhook-ack-load' || format('webhook-ack-load-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  load:
    name: Webhook ACK load
    # workflow_dispatch can target any branch; only main may use the staging environment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Validate inputs
        shell: bash
        env:
          WINDOW: ${{ inputs.window }}
          COUNT: ${{ inputs.count }}
          CONCURRENCY: ${{ inputs.concurrency }}
          BODY_BYTES: ${{ inputs.body_bytes }}
        run: |
          if [[ -z "${WINDOW//[[:space:]]/}" ]]; then
            echo "::error::window must name the agreed load window, the approver and the issue/comment link" >&2
            exit 1
          fi
          # One line of text: it is echoed in the step summary and the report.
          if [[ "${WINDOW}" =~ [[:cntrl:]] ]] || (( ${#WINDOW} > 300 )); then
            echo "::error::window must be one line of at most 300 characters without control characters" >&2
            exit 1
          fi
          # The same caps as scripts/webhook_ack_load.py, checked before anything is sent.
          check() {
            local name="$1" value="$2" minimum="$3" maximum="$4"
            if [[ ! "${value}" =~ ^[1-9][0-9]{0,5}$ ]] || (( value < minimum || value > maximum )); then
              echo "::error::${name} must be an integer from ${minimum} to ${maximum}" >&2
              exit 1
            fi
          }
          check count "${COUNT}" 1 1000
          check concurrency "${CONCURRENCY}" 1 10
          check body_bytes "${BODY_BYTES}" 64 65536

      - name: Resolve staging webhook URL
        id: target
        shell: bash
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          # As the deploy job resolves it: the Terraform host when STAGING_HOST is set, otherwise
          # the course VPS behind the edge proxy.
          if [[ -n "${STAGING_HOST}" ]]; then
            if [[ ! "${STAGING_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]; then
              echo "::error::staging host '${STAGING_HOST}' is not a hostname or IPv4 address" >&2
              exit 1
            fi
            base_url="http://${STAGING_HOST}"
          elif [[ "${APP_DOMAIN}" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]]; then
            base_url="https://staging-api.${APP_DOMAIN}"
          else
            echo "::error::No staging target: set variable STAGING_HOST (Terraform host) or APP_DOMAIN (course VPS)" >&2
            exit 1
          fi
          echo "url=${base_url}/webhooks/github" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.13"

      - name: uv sync
        run: uv sync --locked

      - name: Run webhook ACK load
        shell: bash
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          URL: ${{ steps.target.outputs.url }}
          # The script's host guard accepts the Terraform host only as this value.
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          COMMIT_SHA: ${{ github.sha }}
          WINDOW: ${{ inputs.window }}
          COUNT: ${{ inputs.count }}
          CONCURRENCY: ${{ inputs.concurrency }}
          BODY_BYTES: ${{ inputs.body_bytes }}
        run: |
          if [[ -z "${GITHUB_WEBHOOK_SECRET}" ]]; then
            echo "::error::Set the staging environment secret GH_WEBHOOK_SECRET before dispatch." >&2
            exit 1
          fi
          uv run --locked python scripts/webhook_ack_load.py \
            --url "${URL}" \
            --count "${COUNT}" \
            --concurrency "${CONCURRENCY}" \
            --body-bytes "${BODY_BYTES}" \
            --environment staging \
            --commit "${COMMIT_SHA}" \
            --window="${WINDOW}" \
            --max-seconds 600 \
            --report-json "${RUNNER_TEMP}/webhook-ack-load.json"

      # The runner's own python3: this step also runs when a step before `Setup uv` failed.
      - name: Summarize load
        if: always()
        shell: bash
        env:
          WINDOW: ${{ inputs.window }}
        run: |
          python3 - <<'PYTHON'
          import html
          import json
          import os
          from pathlib import Path


          def cell(value):
              return html.escape(str(value)).replace("|", "&#124;")


          report_path = Path(os.environ["RUNNER_TEMP"]) / "webhook-ack-load.json"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Webhook ACK load (staging)\n\n")
              # json.dumps: the input reaches this step even when `Validate inputs` rejected it.
              summary.write(f"Agreed window: {cell(json.dumps(os.environ.get('WINDOW', '')))}\n\n")
              summary.write(
                  "The client is a GitHub-hosted runner: the latency includes the WAN round trip "
                  "and TLS setup of each new connection, not only the server's ACK.\n\n"
              )
              if not report_path.is_file():
                  summary.write("No load report was produced. See the failed step for details.\n")
              else:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  latency = report["latency_ms"] or {}
                  statuses = ", ".join(f"{key}: {value}" for key, value in report["statuses"].items())
                  rows = [
                      ("Environment", report["environment"]),
                      ("Commit", report["commit"]),
                      ("Target", report["target_host"]),
                      ("Window (UTC)", f"{report['started_at']} - {report['finished_at']}"),
                      ("Timed / warm-up / sent", f"{report['count']} / {report['warmup']} / {report['sent']}"),
                      ("Concurrency", report["concurrency"]),
                      ("Body bytes", report["body_bytes"]),
                      ("Statuses", statuses),
                      *((f"Transport error {name}", message) for name, message in report["errors"].items()),
                      ("Time limit (s)", report["max_seconds"]),
                      *((f"{key} ms", latency[key]) for key in ("p50", "p95", "p99", "max") if key in latency),
                      *((("Stopped early", report["aborted"]),) if report["aborted"] else ()),
                      ("Verdict", report["verdict"]),
                  ]
                  summary.write("| Metric | Value |\n|---|---|\n")
                  for name, value in rows:
                      summary.write(f"| {cell(name)} | {cell(value)} |\n")
          PYTHON

      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhook-ack-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webhook-ack-load.json
          if-no-files-found: warn
          retention-days: 90
