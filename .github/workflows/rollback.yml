name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image tag or digest. Leave empty to restore the previous successful deploy."
        required: false
        type: string
      reason:
        description: "Why staging is being rolled back"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.STAGING_HOST }}
    outputs:
      image_ref: ${{ steps.deployed.outputs.stdout }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Set image coordinates
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image
        id: image
        env:
          REQUESTED: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${REQUESTED}" ]]; then
            if [[ "${REQUESTED}" == *'/'* ]]; then
              echo "ref=${REQUESTED}" >> "${GITHUB_OUTPUT}"
            else
              echo "ref=ghcr.io/${repo}:${REQUESTED}" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "ref=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail
            set +o xtrace
            if [[ -n "${IMAGE}" ]]; then
              /opt/dmc-268-api/rollback.sh "${IMAGE}"
            else
              /opt/dmc-268-api/rollback.sh
            fi

      - name: Health check
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: |
          chmod +x deploy/scripts/healthcheck.sh
          target="${HEALTH_URL:-http://${STAGING_HOST}/healthcheck}"
          deploy/scripts/healthcheck.sh "${target}"

      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          script: |
            awk -F= '/^current_image=/{print $2; exit}' /opt/dmc-268-api/.deploy-state

  promote-staging:
    name: Promote staging tag
    needs: rollback
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Promote rolled-back image to staging
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image_ref="${{ needs.rollback.outputs.image_ref }}"
          staging="${{ needs.rollback.outputs.staging }}"
          previous="${{ needs.rollback.outputs.previous }}"
          if [[ -z "${image_ref}" || "${image_ref}" == "bootstrap" ]]; then
            echo "skip registry promotion for bootstrap rollback"
            exit 0
          fi
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          fi
          docker pull "${image_ref}"
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
