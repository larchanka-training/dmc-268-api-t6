name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image tag or digest. Leave empty to restore the previous successful deploy."
        required: false
        type: string
      reason:
        description: "Why staging is being rolled back"
        required: true
        type: string

permissions:
  contents: read
  packages: read

# Whole-run lock for main only: a dispatch from another branch gets its own throwaway group,
# so it cannot replace a pending main deploy or promotion before its jobs are skipped.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'staging-deploy' || format('rollback-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback staging
    # workflow_dispatch can target any branch; only main may use the staging SSH key.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.target.outputs.base_url }}
    outputs:
      image_ref: ${{ steps.parsed.outputs.image_ref }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Resolve staging target
        id: target
        env:
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          HAS_STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
          VPS_HOST: ${{ vars.VPS_DMC268_IP_T6 }}
          HAS_VPS_USER: ${{ secrets.VPS_DMC268_U != '' }}
          HAS_VPS_PASSWORD: ${{ secrets.VPS_DMC268_P != '' }}
          STAGING_SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
        run: |
          # Terraform/Hetzner host (key auth) when STAGING_HOST is set, otherwise the shared course VPS
          # (password auth, port 22). Only non-secret values go to the step outputs.
          if [[ -n "${STAGING_HOST}" ]]; then
            mode=terraform
            host="${STAGING_HOST}"
            port="${STAGING_SSH_PORT}"
            if [[ ! "${port}" =~ ^[0-9]+$ ]]; then
              echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
              exit 1
            fi
            if [[ -z "${STAGING_SSH_USER}" || "${HAS_STAGING_SSH_KEY}" != "true" ]]; then
              echo "Terraform target needs variable STAGING_SSH_USER and secret STAGING_SSH_KEY (environment staging)" >&2
              exit 1
            fi
          elif [[ -n "${VPS_HOST}" ]]; then
            mode=course
            host="${VPS_HOST}"
            port=22
            if [[ "${HAS_VPS_USER}" != "true" || "${HAS_VPS_PASSWORD}" != "true" ]]; then
              echo "Course VPS target needs organization secrets VPS_DMC268_U and VPS_DMC268_P" >&2
              exit 1
            fi
          else
            echo "No staging target: set STAGING_HOST, STAGING_SSH_PORT, STAGING_SSH_USER and STAGING_SSH_KEY (Terraform host)" \
              "or organization variable VPS_DMC268_IP_T6 with secrets VPS_DMC268_U and VPS_DMC268_P (course VPS)" >&2
            exit 1
          fi
          if [[ ! "${host}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "staging host '${host}' is not a hostname or IPv4 address" >&2
            exit 1
          fi
          # With an empty fingerprint the appleboy actions accept any host key.
          if [[ ! "${STAGING_SSH_FINGERPRINT}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "GitHub variable STAGING_SSH_FINGERPRINT must be the ${mode} host key fingerprint SHA256:<43 base64 chars> (ssh-keyscan -p ${port} ${host} | ssh-keygen -lf - -E sha256)" >&2
            exit 1
          fi
          base_url="http://${host}"
          health_url="${base_url}/healthcheck"
          if [[ "${mode}" == "terraform" && -n "${STAGING_HEALTH_URL}" ]]; then
            health_url="${STAGING_HEALTH_URL}"
          fi
          {
            echo "mode=${mode}"
            echo "host=${host}"
            echo "port=${port}"
            echo "base_url=${base_url}"
            echo "health_url=${health_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "staging target: ${mode} (${host}:${port})"

      - name: Set image coordinates
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image
        id: image
        env:
          REQUESTED: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${REQUESTED}" ]]; then
            if [[ "${REQUESTED}" == *'/'* ]]; then
              echo "ref=${REQUESTED}" >> "${GITHUB_OUTPUT}"
            else
              echo "ref=ghcr.io/${repo}:${REQUESTED}" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "ref=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail
            set +o xtrace
            if [[ -n "${IMAGE}" ]]; then
              /opt/dmc-268-api/rollback.sh "${IMAGE}"
            else
              /opt/dmc-268-api/rollback.sh
            fi

      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ steps.target.outputs.host }}
          port: ${{ steps.target.outputs.port }}
          username: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_U || vars.STAGING_SSH_USER }}
          key: ${{ steps.target.outputs.mode == 'terraform' && secrets.STAGING_SSH_KEY || '' }}
          password: ${{ steps.target.outputs.mode == 'course' && secrets.VPS_DMC268_P || '' }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          script: |
            state=/opt/dmc-268-api/.deploy-state
            if [[ -f "${state}" ]]; then
              awk -F= '/^current_image=/{print $2; exit}' "${state}"
            else
              echo bootstrap
            fi

      - name: Parse deployed image
        id: parsed
        env:
          DEPLOYED_STDOUT: ${{ steps.deployed.outputs.stdout }}
        run: |
          # drone-ssh appends its own success banner; the first line is the script output.
          image_ref="$(printf '%s\n' "${DEPLOYED_STDOUT}" | head -n 1 | tr -d '\r')"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "staging runs: ${image_ref:-<empty>}"

      - name: Health check
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
          DEPLOYED_IMAGE: ${{ steps.parsed.outputs.image_ref }}
        run: |
          if [[ "${DEPLOYED_IMAGE}" == "bootstrap" ]]; then
            # The bootstrap nginx has no /healthcheck; it must answer 200 on /.
            url="${BASE_URL}/"
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --retry 12 --retry-delay 5 --retry-all-errors --max-time 5 "${url}")"
            if [[ "${code}" != "200" ]]; then
              echo "bootstrap returned HTTP ${code} on ${url}, expected 200" >&2
              exit 1
            fi
            echo "bootstrap check passed: HTTP ${code} on ${url}"
            exit 0
          fi
          chmod +x deploy/scripts/healthcheck.sh
          deploy/scripts/healthcheck.sh "${HEALTH_URL}"

  promote-staging:
    name: Promote staging tag
    if: github.ref == 'refs/heads/main'
    needs: rollback
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Promote rolled-back image to staging
        env:
          DEPLOYED_IMAGE: ${{ needs.rollback.outputs.image_ref }}
          STAGING_TAG: ${{ needs.rollback.outputs.staging }}
          PREVIOUS_TAG: ${{ needs.rollback.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image_ref="${DEPLOYED_IMAGE}"
          staging="${STAGING_TAG}"
          previous="${PREVIOUS_TAG}"
          if [[ "${image_ref}" == "bootstrap" ]]; then
            echo "staging runs the bootstrap container; skip registry promotion"
            exit 0
          fi
          # image_ref comes from .deploy-state on an internet-facing VM: promote only this repository's images.
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}"
          suffix="${image_ref#"${image}"}"
          digest_ref='^(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$'
          sha_tag_ref='^:[0-9a-f]{40}$'
          if [[ "${suffix}" == "${image_ref}" ]] || [[ ! "${suffix}" =~ ${digest_ref} && ! "${suffix}" =~ ${sha_tag_ref} ]]; then
            echo "refusing to promote '${image_ref}': expected ${image}@sha256:<digest>, ${image}:<full git sha> or bootstrap" >&2
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          fi
          docker pull "${image_ref}"
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
