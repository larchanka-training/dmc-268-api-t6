name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image tag or digest. Leave empty to restore the previous successful deploy."
        required: false
        type: string
      reason:
        description: "Why staging is being rolled back"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.STAGING_HOST }}
    outputs:
      image_ref: ${{ steps.parsed.outputs.image_ref }}
      staging: ${{ steps.meta.outputs.staging }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Check SSH port variable
        env:
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
        run: |
          if [[ ! "${STAGING_SSH_PORT}" =~ ^[0-9]+$ ]]; then
            echo "GitHub variable STAGING_SSH_PORT (environment staging) must be set to the sshd port (Terraform output ssh_port)" >&2
            exit 1
          fi

      - name: Set image coordinates
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo}"
          echo "staging=${image}:staging" >> "${GITHUB_OUTPUT}"
          echo "previous=${image}:staging-previous" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image
        id: image
        env:
          REQUESTED: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${REQUESTED}" ]]; then
            if [[ "${REQUESTED}" == *'/'* ]]; then
              echo "ref=${REQUESTED}" >> "${GITHUB_OUTPUT}"
            else
              echo "ref=ghcr.io/${repo}:${REQUESTED}" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "ref=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ vars.STAGING_HOST }}
          port: ${{ vars.STAGING_SSH_PORT }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail
            set +o xtrace
            if [[ -n "${IMAGE}" ]]; then
              /opt/dmc-268-api/rollback.sh "${IMAGE}"
            else
              /opt/dmc-268-api/rollback.sh
            fi

      - name: Read deployed image
        id: deployed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.STAGING_HOST }}
          port: ${{ vars.STAGING_SSH_PORT }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ vars.STAGING_SSH_FINGERPRINT }}
          debug: false
          capture_stdout: true
          script: |
            state=/opt/dmc-268-api/.deploy-state
            if [[ -f "${state}" ]]; then
              awk -F= '/^current_image=/{print $2; exit}' "${state}"
            else
              echo bootstrap
            fi

      - name: Parse deployed image
        id: parsed
        env:
          DEPLOYED_STDOUT: ${{ steps.deployed.outputs.stdout }}
        run: |
          # drone-ssh appends its own success banner; the first line is the script output.
          image_ref="$(printf '%s\n' "${DEPLOYED_STDOUT}" | head -n 1 | tr -d '\r')"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "staging runs: ${image_ref:-<empty>}"

      - name: Health check
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          DEPLOYED_IMAGE: ${{ steps.parsed.outputs.image_ref }}
        run: |
          if [[ "${DEPLOYED_IMAGE}" == "bootstrap" ]]; then
            # The bootstrap nginx has no /healthcheck; it must answer 200 on /.
            url="http://${STAGING_HOST}/"
            code="$(curl -fsS -o /dev/null -w '%{http_code}' --retry 12 --retry-delay 5 --retry-all-errors --max-time 5 "${url}")"
            if [[ "${code}" != "200" ]]; then
              echo "bootstrap returned HTTP ${code} on ${url}, expected 200" >&2
              exit 1
            fi
            echo "bootstrap check passed: HTTP ${code} on ${url}"
            exit 0
          fi
          chmod +x deploy/scripts/healthcheck.sh
          target="${HEALTH_URL:-http://${STAGING_HOST}/healthcheck}"
          deploy/scripts/healthcheck.sh "${target}"

  promote-staging:
    name: Promote staging tag
    needs: rollback
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Promote rolled-back image to staging
        env:
          DEPLOYED_IMAGE: ${{ needs.rollback.outputs.image_ref }}
          STAGING_TAG: ${{ needs.rollback.outputs.staging }}
          PREVIOUS_TAG: ${{ needs.rollback.outputs.previous }}
        run: |
          image_ref="${DEPLOYED_IMAGE}"
          staging="${STAGING_TAG}"
          previous="${PREVIOUS_TAG}"
          if [[ "${image_ref}" == "bootstrap" ]]; then
            echo "staging runs the bootstrap container; skip registry promotion"
            exit 0
          fi
          digest_ref='^[a-z0-9./-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$'
          sha_tag_ref='^[a-z0-9./-]+:[0-9a-f]{40}$'
          if [[ ! "${image_ref}" =~ ${digest_ref} && ! "${image_ref}" =~ ${sha_tag_ref} ]]; then
            echo "refusing to promote '${image_ref}': expected a digest ref, a :<full git sha> tag or bootstrap" >&2
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "${staging}"; then
            docker tag "${staging}" "${previous}"
            docker push "${previous}"
          fi
          docker pull "${image_ref}"
          docker tag "${image_ref}" "${staging}"
          docker push "${staging}"
