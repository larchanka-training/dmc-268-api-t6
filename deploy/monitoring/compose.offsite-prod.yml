# Off-host copy of the prod database dumps (backup/offsite.sh, docs/MONITORING.md §9): the twin of
# backup-offsite of compose.offsite.yml. Same bucket, keys and passphrase (BACKUP_S3_*), but its own
# path, store:<bucket>/postgres-prod, a sibling of the staging path and not below it: a pass of one
# environment can never list, overwrite or prune the copies of the other. deploy.sh adds this file
# only with prod (compose.prod.yml) and with every BACKUP_S3_* value and the passphrase set;
# without prod ${PROD_BACKUP_DIR} would be missing, hence a file of its own.
services:
  backup-offsite-prod:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    entrypoint: ["sh", "/opt/pg-backup/offsite.sh"]
    command: ["loop"]
    # The owner of the dump dir and the textfile dir (pg-backup-prod); read-only on the dumps.
    user: "70:70"
    environment:
      # No config file: both remotes come from the environment.
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_STORE_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID is required}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY is required}
      # A token scoped to one bucket may neither list nor create buckets.
      RCLONE_CONFIG_STORE_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_SECURE_TYPE: crypt
      RCLONE_CONFIG_SECURE_REMOTE: store:${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}/postgres-prod
      # As in compose.offsite.yml: the obscured passphrase, plain file names.
      RCLONE_CONFIG_SECURE_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD_OBSCURED:?BACKUP_ENCRYPTION_PASSWORD_OBSCURED is required}
      RCLONE_CONFIG_SECURE_FILENAME_ENCRYPTION: "off"
      BACKUP_ENVIRONMENT: prod
      # A file of its own next to the staging one: node-exporter reads every *.prom of the dir.
      TEXTFILE: /textfile/pg_backup_offsite_prod.prom
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-30}
    labels:
      dmc.config-digest: ${PG_BACKUP_CONFIG_DIGEST:-none}
    volumes:
      - ./backup:/opt/pg-backup:ro
      - ${PROD_BACKUP_DIR:?PROD_BACKUP_DIR is required}:/backups:ro
      - ${TEXTFILE_DIR:-./textfile}:/textfile
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
