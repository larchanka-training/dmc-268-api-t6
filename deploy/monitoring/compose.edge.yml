# Shared course VPS: Grafana joins the edge proxy network as GRAFANA_ALIAS (grafana-staging), served
# by Caddy at https://grafana.<APP_DOMAIN>/; Prometheus joins it to scrape the request
# metrics of Caddy (deploy/edge/Caddyfile, port 9180). The status page joins it as status-staging,
# served at https://status.<APP_DOMAIN>/ and https://staging-status.<APP_DOMAIN>/. No host port.
services:
  grafana:
    networks:
      default: {}
      api: {}
      edge:
        aliases:
          - ${GRAFANA_ALIAS:?GRAFANA_ALIAS is required}

  prometheus:
    networks:
      default: {}
      api: {}
      edge: {}

  status-page:
    networks:
      default: {}
      edge:
        aliases:
          - status-staging

networks:
  edge:
    name: dmc268-edge
    external: true
