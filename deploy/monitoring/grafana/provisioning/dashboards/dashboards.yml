# Dashboards of grafana/dashboards, read-only in the UI: a change goes through a PR.
apiVersion: 1

providers:
  - name: dmc-268
    folder: AI Code Reviewer
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
