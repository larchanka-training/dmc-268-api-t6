# Alert rules of the monitoring stack (docs/MONITORING.md §5). Alertmanager sends them to the
# team Telegram channel. Annotations carry counts and names only: no review content, no secrets.
# kind: event marks an alert about something that happened (a failed run, a new dead letter), not a
# state: Alertmanager sends it once, without RESOLVED when it leaves its window
# (alertmanager-config.sh).
# Unit tests: tests/monitoring/alerts.test.yml (promtool test rules, CI job monitoring-validate).
groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus has not reached {{ $labels.job }} for 5 minutes."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "postgres-exporter cannot connect to PostgreSQL for 2 minutes."

      - alert: RedisDown
        expr: redis_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache is unreachable"
          description: "The review context runs without its cache (SD §10) until Redis is back."

      # staging-webhook is not here: it is a reserved 503 stub without a service (docs/CICD.md §8.2),
      # GitHub delivers webhooks to staging-api. Add it when the webhook service exists.
      - alert: ApiHigh5xxRate
        expr: |
          (
            sum by (environment, host) (rate(caddy_http_request_duration_seconds_count{host=~"staging-(api|ui)\\..+", code=~"5.."}[5m]))
            /
            sum by (environment, host) (rate(caddy_http_request_duration_seconds_count{host=~"staging-(api|ui)\\..+"}[5m]))
          ) > 0.05
          and
          sum by (environment, host) (rate(caddy_http_request_duration_seconds_count{host=~"staging-(api|ui)\\..+"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }}: {{ $value | humanizePercentage }} of requests end in 5xx"
          description: "More than 5% of requests to {{ $labels.host }} returned 5xx for 5 minutes."

      # The probe is the request itself (blackbox job, once a minute), so no user traffic is needed.
      # Any non-2xx final answer (redirects are followed) counts as down, 4xx and the 503 stub of the
      # edge proxy included. When the exporter itself is down its series go stale and TargetDown
      # (job blackbox) fires instead.
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} is down from outside"
          description: "The HTTPS probe of {{ $labels.instance }} has failed for 5 minutes: a connection or TLS error or a non-2xx answer, the 503 stub included."

      # webhook-worker consumes no queue (it listens to PostgreSQL NOTIFY and only publishes), so
      # cAdvisor watches its container instead, per compose project of the app: staging, the
      # Terraform host and prod alike. container_health_state is the Docker healthcheck (heartbeat
      # file): 1 healthy, 0 starting or unhealthy, -1 no healthcheck; cAdvisor refreshes it at each
      # housekeeping (30-60 s, up to 120 s for an idle container). A stopped container leaves
      # cAdvisor at once and goes stale at the next scrape (track_timestamps_staleness,
      # prometheus.yml): a project whose postgres runs without it counts as stopped. Both cases
      # share one label set, so a crash loop does not restart `for`. A project down as a whole does
      # not fire here: PostgresDown, TargetDown and PublicEndpointDown do, for staging and prod
      # alike (the environment label tells them apart). The alert keeps the environment of the
      # project, which prometheus.yml derives from the compose project label.
      - alert: WebhookWorkerDown
        expr: |
          max by (environment, container_label_com_docker_compose_project) (
            container_health_state{container_label_com_docker_compose_project=~"dmc-268-api.*", container_label_com_docker_compose_service="webhook-worker"}
          ) == 0
          or
          (
            max by (environment, container_label_com_docker_compose_project) (container_last_seen{container_label_com_docker_compose_project=~"dmc-268-api.*", container_label_com_docker_compose_service="postgres"})
            unless
            max by (environment, container_label_com_docker_compose_project) (container_last_seen{container_label_com_docker_compose_project=~"dmc-268-api.*", container_label_com_docker_compose_service="webhook-worker"})
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "webhook-worker of {{ $labels.container_label_com_docker_compose_project }} is stopped or unhealthy"
          description: "GitHub deliveries are accepted and stored but not processed; see docker compose -p {{ $labels.container_label_com_docker_compose_project }} ps webhook-worker."

  # Certificates of the probed names. probe_ssl_earliest_cert_expiry is the earliest expiry of all
  # the certificates a name serves (leaf and intermediates), one series per name; should a
  # short-lived cross-sign ever be served, probe_ssl_last_chain_expiry_timestamp_seconds (the best
  # verified chain) is the alternative. Caddy renews with about a third of the lifetime left:
  # 30 d of 90, ~21 d of 64 (Let's Encrypt from Feb 2027), 15 d of 45 (from Feb 2028, 1 d above
  # the warning). A probe without a TLS answer (connection error, timeout) has no expiry series:
  # last_over_time keeps the last one for 10 minutes, so a probe failing for less than that
  # neither restarts `for` nor resolves the alerts; a longer outage, an expired certificate
  # included, resolves them and PublicEndpointDown carries it. Below 3 days both alerts fire
  # (no inhibit rules).
  - name: certificates
    rules:
      - alert: TlsCertificateExpiresSoon
        expr: (last_over_time(probe_ssl_earliest_cert_expiry{job="blackbox"}[10m]) - time()) / 86400 < 14
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Certificate of {{ $labels.host }} expires in {{ $value | printf \"%.1f\" }} days"
          description: "Caddy renews a certificate when about a third of its lifetime is left, so less than 14 days means the renewal has failed; see docker compose -p dmc-268-edge logs caddy."

      - alert: TlsCertificateExpiring
        expr: (last_over_time(probe_ssl_earliest_cert_expiry{job="blackbox"}[10m]) - time()) / 86400 < 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Certificate of {{ $labels.host }} expires in {{ $value | printf \"%.1f\" }} days"
          description: "When the certificate expires every client fails the TLS handshake with this name; see docker compose -p dmc-268-edge logs caddy."

  - name: review-pipeline
    rules:
      # No `for`: the failure has already happened, waiting adds nothing.
      - alert: ReviewRunsFailed
        expr: sum by (environment) (dmc_runs_finished_15m_runs{state="failed"}) > 0
        labels:
          severity: warning
          kind: event
        annotations:
          summary: "{{ $value }} review run(s) failed in the last 15 minutes"
          description: "Open the runs with state failed in the portal or the Grafana dashboard for error_code."

      # New dead letters, not the queue size: reviews.dlq keeps a message 7 days and nothing drains
      # it, so a size alert would repeat for a week and stay silent on the next failure. The size
      # stays on the dashboard (panel "Review queues: ready messages").
      - alert: ReviewDeadLetters
        expr: sum by (environment) (delta(rabbitmq_detailed_queue_messages{queue="reviews.dlq"}[15m])) > 0
        labels:
          severity: critical
          kind: event
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} new message(s) in reviews.dlq in the last 15 minutes"
          description: "Retries exhausted, an unknown schema or an unexpected error (docs/PIPELINE_SPEC.md §4.4); the operator reads the DLQ."

      - alert: ReviewQueueBacklog
        expr: sum by (environment, queue) (rabbitmq_detailed_queue_messages_ready{queue=~"review\\.run\\..+|review\\.publish"}) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} message(s) wait in {{ $labels.queue }}"
          description: "The queue has held more than 20 ready messages for 10 minutes; workers do not keep up."

      - alert: ReviewQueueWithoutConsumer
        expr: sum by (environment, queue) (rabbitmq_detailed_queue_consumers{queue=~"review\\.run\\.fast|review\\.publish"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No worker consumes {{ $labels.queue }}"
          description: "The review worker is down or detached from the broker for 5 minutes."

      - alert: ReviewRunsStuckInQueue
        expr: max by (environment) (dmc_runs_active_stale_queued) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} run(s) queued for more than 10 minutes"
          description: "Runs stay queued past available_at (T18 of docs/PIPELINE_SPEC.md §3)."

      - alert: LlmLatencyHigh
        expr: max by (environment) (dmc_llm_calls_15m_p95_seconds) > 60 and max by (environment) (dmc_llm_calls_15m_calls) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM calls are slow: p95 {{ $value | humanizeDuration }} over 15 minutes"
          description: "The fast-engine call timeout is 90 s (docs/PIPELINE_SPEC.md §3)."

  # The monthly LLM budget. dmc_llm_cost_month_usd is the spend recorded in usage_events since the
  # 1st of the month (UTC), one series per scraped database: the rules sum them all, so every
  # environment scraped here counts against one budget, so the two monthly alerts carry the
  # environment label shared. The threshold dmc_llm_monthly_budget_usd is a node-exporter
  # textfile that deploy.sh writes from the repository variable LLM_MONTHLY_BUDGET_USD: without
  # it, or at 0, the two monthly alerts stay silent. The warning stops below 100%, so at the budget
  # the critical alert fires at once and the warning resolves 5 minutes later (no inhibit rules).
  # keep_firing_for bridges a missed scrape of either exporter: a stale series empties the
  # expression, and the alert would otherwise send RESOLVED and fire again. The warning holds
  # 5 minutes, so it does not linger next to the critical; the critical holds 30 minutes, so a
  # scrape or database outage does not resolve it either (TargetDown or PostgresDown report those;
  # a month query that fails on its own raises no alert). In the two monthly alerts $value is the
  # percent, with two decimals so that 99.96% does not read as 100%; the summary queries the sum.
  # The group also holds ReviewRunsBudgetPaused: the daily budget of a workspace, no threshold.
  - name: llm-budget
    rules:
      - alert: LlmMonthlyBudgetWarning
        expr: 100 * sum(dmc_llm_cost_month_usd) / (max(dmc_llm_monthly_budget_usd) > 0) >= 80 < 100
        for: 5m
        keep_firing_for: 5m
        labels:
          severity: warning
          environment: shared
        annotations:
          summary: "LLM spend this month: {{ with query \"sum(dmc_llm_cost_month_usd)\" }}{{ . | first | value | printf \"%.2f\" }}{{ end }} USD, {{ $value | printf \"%.2f\" }}% of the monthly budget"
          description: "Spend in usage_events since the 1st of the month (UTC) is between 80% and 100% of LLM_MONTHLY_BUDGET_USD; at 100% LlmMonthlyBudgetExceeded takes over and this alert resolves; the alert pauses no reviews."

      # No `for`: within a month the sum only grows and a scrape gap leaves no series (bridged by
      # keep_firing_for), so waiting filters nothing and would only delay the critical message.
      # 30m, not the 5m of the warning: a postgres-exporter outage or restart longer than 5 minutes
      # would send RESOLVED and fire again once the scrape returns. The cost: after the month rolls
      # over or the budget is raised, the alert resolves up to 30 minutes later.
      - alert: LlmMonthlyBudgetExceeded
        expr: 100 * sum(dmc_llm_cost_month_usd) / (max(dmc_llm_monthly_budget_usd) > 0) >= 100
        keep_firing_for: 30m
        labels:
          severity: critical
          environment: shared
        annotations:
          summary: "LLM spend this month: {{ with query \"sum(dmc_llm_cost_month_usd)\" }}{{ . | first | value | printf \"%.2f\" }}{{ end }} USD, {{ $value | printf \"%.2f\" }}% of the monthly budget"
          description: "Spend in usage_events since the 1st of the month (UTC) has reached LLM_MONTHLY_BUDGET_USD; the alert pauses no reviews, they keep spending."

      # Not the monthly budget above: the application itself skips the runs of a workspace whose
      # daily budget is spent (error_code budget_paused). No `for`, like ReviewRunsFailed: the runs
      # are already skipped. keep_firing_for holds it 1 hour after the 15-minute window empties:
      # pushes into a paused workspace less often than every 15 minutes stay one alert and one
      # message, not one per skip. While it fires, Alertmanager repeats it every 4 hours like any
      # other.
      - alert: ReviewRunsBudgetPaused
        expr: sum by (environment) (dmc_runs_budget_paused_15m_runs) > 0
        keep_firing_for: 1h
        labels:
          severity: warning
          kind: event
        annotations:
          summary: "{{ $value }} review run(s) skipped with budget_paused in the last 15 minutes"
          description: "The daily budget left in a workspace is below the cost limit of a fast run, so its runs are skipped, not reviewed (docs/PIPELINE_SPEC.md §5.3, §6). The metric counts runs and names no workspace."

  - name: host
    rules:
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host memory available: {{ $value | humanizePercentage }}"
          description: "Less than 10% of the VPS memory has been available for 10 minutes."

      - alert: HostDiskFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem free: {{ $value | humanizePercentage }}"
          description: "Less than 15% of the root filesystem is free."

      - alert: HostCpuHigh
        expr: 1 - avg by (environment) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU busy: {{ $value | humanizePercentage }}"
          description: "The VPS has been more than 90% busy for 15 minutes."

      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{container_label_com_docker_compose_service!=""}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed"
          description: "The kernel killed a process of {{ $labels.name }} for lack of memory in the last 10 minutes."

  # PostgreSQL backups of the pg-backup service (textfile metrics through node-exporter).
  - name: backups
    rules:
      - alert: PostgresBackupStale
        expr: time() - dmc_pg_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Last verified PostgreSQL backup is {{ $value | humanizeDuration }} old"
          description: "No dump has passed the restore check for more than 26 hours (daily schedule)."

      # The heartbeat is rewritten every loop pass (5 min). The textfile outlives a stopped or
      # removed container, so the age of the heartbeat, not its absence, shows that nothing runs.
      - alert: PostgresBackupMissing
        expr: |
          time() - dmc_pg_backup_heartbeat_timestamp_seconds > 2 * 3600
          or
          absent(dmc_pg_backup_heartbeat_timestamp_seconds{environment="staging"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The PostgreSQL backup service has not run for 2 hours"
          description: "pg-backup is stopped, removed or cannot write the textfile dir; see docker compose -p dmc-268-monitoring ps pg-backup."

      - alert: PostgresBackupFailed
        expr: dmc_pg_backup_last_run_success == 0
        labels:
          severity: warning
        annotations:
          summary: "The last PostgreSQL backup attempt failed"
          description: "See docker compose -p dmc-268-monitoring logs pg-backup; the next attempt runs within an hour."

      # Off-host copy (backup-offsite, only when BACKUP_S3_* are set): without it the dumps would
      # not survive the loss of the VPS.
      - alert: PostgresBackupOffsiteStale
        expr: time() - dmc_pg_backup_offsite_last_success_timestamp_seconds > 3 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Off-host backup copy last succeeded {{ $value | humanizeDuration }} ago"
          description: "backup-offsite has not reached the bucket for 3 hours; see docker compose -p dmc-268-monitoring logs backup-offsite."

      - alert: PostgresBackupOffsiteFailing
        expr: dmc_pg_backup_offsite_last_run_success == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Off-host backup copy fails"
          description: "Every backup-offsite pass of the last hour failed (bucket, keys or network)."
