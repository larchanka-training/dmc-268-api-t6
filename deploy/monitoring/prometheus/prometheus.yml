# Prometheus of the monitoring stack (docs/MONITORING.md). Every target is a container name on a
# docker network of the host; nothing is scraped over a public address.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  # Alerts and series carry the environment, so a shared Telegram channel tells staging from prod.
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep the containers of compose projects only: the cgroup hierarchy itself is noise.
      - source_labels: [container_label_com_docker_compose_project]
        regex: ""
        action: drop

  # The review queues (SD §7.1): aggregated node metrics and per-queue depth and consumers.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # One scrape runs the review queries of postgres-exporter/queries.yml over runs and run_actions.
  - job_name: postgres
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Request metrics of the edge proxy. deploy.sh writes the target in edge mode only; on a host
  # without the proxy the file is an empty list and the job has no target.
  - job_name: caddy
    file_sd_configs:
      - files: ["/etc/prometheus/targets/caddy.json"]
