# Prometheus of the monitoring stack (docs/MONITORING.md). Every target is a container name on a
# docker network of the host; the public names are reached only by the probes of the blackbox
# exporter, which Prometheus scrapes on the project network like the other exporters.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  # Alerts and series carry the environment, so a shared Telegram channel tells staging from prod.
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    # cAdvisor timestamps its samples: without this a stopped container lingers for 5 minutes.
    track_timestamps_staleness: true
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep the containers of compose projects only: the cgroup hierarchy itself is noise.
      - source_labels: [container_label_com_docker_compose_project]
        regex: ""
        action: drop

  # The review queues (SD §7.1): aggregated node metrics and per-queue depth and consumers.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # One scrape runs the review queries of postgres-exporter/queries.yml over runs and run_actions.
  - job_name: postgres
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Request metrics of the edge proxy. deploy.sh writes the target in edge mode only; on a host
  # without the proxy the file is an empty list and the job has no target.
  - job_name: caddy
    file_sd_configs:
      - files: ["/etc/prometheus/targets/caddy.json"]

  # HTTPS probes of the public names through the edge proxy, once a minute: Prometheus asks the
  # blackbox exporter to probe each URL of the file and labels the result with it. deploy.sh writes
  # the names in edge mode only; on a host without the proxy the file is an empty list. The file is
  # not in the repository: the upload would replace it, and a deploy failing before deploy.sh writes
  # it would leave the names unprobed. Without the file (promtool warns) the job has no target.
  - job_name: blackbox
    scrape_interval: 1m
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/probes.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
