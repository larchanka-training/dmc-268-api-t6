# Review metrics of postgres-exporter (--extend.query-path), for the alert rules of
# prometheus/rules/alerts.yml. The role metrics_exporter reads only the columns granted by
# deploy/monitoring/deploy.sh: states, timestamps, tool names, durations and LLM cost, never review
# content. One scrape per minute. The queries over runs and run_actions are bounded by a recent time
# window or an indexed state; the month query of LLM cost reads all of usage_events (see its block).

# Runs that reached a final state in the last 15 minutes, by state (docs/PIPELINE_SPEC.md §1).
dmc_runs_finished_15m:
  query: |
    SELECT state::text AS state, count(*)::float8 AS runs
    FROM runs
    WHERE finished_at > now() - interval '15 minutes'
    GROUP BY state
  metrics:
    - state:
        usage: LABEL
        description: Final state of the run
    - runs:
        usage: GAUGE
        description: Runs that finished in the last 15 minutes

# Runs not finished yet. stale_queued: queued past available_at for 10 minutes, the condition of
# the reconciler's T18 (docs/PIPELINE_SPEC.md §3).
dmc_runs_active:
  query: |
    SELECT
      count(*) FILTER (WHERE state = 'queued')::float8 AS queued,
      count(*) FILTER (WHERE state IN ('running', 'publishing'))::float8 AS in_progress,
      count(*) FILTER (
        WHERE state = 'queued' AND available_at < now() - interval '10 minutes'
      )::float8 AS stale_queued
    FROM runs
    WHERE state IN ('queued', 'running', 'publishing')
  metrics:
    - queued:
        usage: GAUGE
        description: Runs in state queued
    - in_progress:
        usage: GAUGE
        description: Runs in state running or publishing
    - stale_queued:
        usage: GAUGE
        description: Queued runs past available_at by more than 10 minutes

# Provider calls of the LLM gateway (run_actions.tool = 'llm.call', one per generation call).
# On a conventions cache miss the conventions call is counted with the review calls: the call
# kind is not in the run_actions columns this role reads (deploy.sh). LlmLatencyHigh does not
# depend on it: any call over 60 s is a problem.
dmc_llm_calls_15m:
  query: |
    SELECT
      count(*)::float8 AS calls,
      coalesce(percentile_cont(0.5) WITHIN GROUP (ORDER BY duration_ms), 0) / 1000.0 AS p50_seconds,
      coalesce(percentile_cont(0.95) WITHIN GROUP (ORDER BY duration_ms), 0) / 1000.0 AS p95_seconds
    FROM run_actions
    WHERE tool = 'llm.call' AND started_at > now() - interval '15 minutes'
  metrics:
    - calls:
        usage: GAUGE
        description: LLM calls started in the last 15 minutes
    - p50_seconds:
        usage: GAUGE
        description: Median LLM call duration over the last 15 minutes
    - p95_seconds:
        usage: GAUGE
        description: 95th percentile LLM call duration over the last 15 minutes

# LLM spend recorded in this database since the start of the calendar month in UTC (usage_events,
# one row per provider call). The three-argument date_trunc ignores the session time zone; coalesce
# keeps the series at 0 until the first call of the month. No index covers created_at alone and
# nothing purges the ledger, so every scrape reads the whole usage_events history (about 50 ms per
# 200 000 rows). Once the table grows, add a BRIN or btree index on created_at by a separate
# migration. The budget alerts sum the series of every database this Prometheus scrapes.
dmc_llm_cost_month:
  query: |
    SELECT coalesce(sum(cost_usd), 0)::float8 AS usd
    FROM usage_events
    WHERE created_at >= date_trunc('month', now(), 'UTC')
  metrics:
    - usd:
        usage: GAUGE
        description: LLM cost in USD since the start of the month (UTC)

# Runs skipped because the daily budget left in a workspace is below the cost limit of a fast run
# (error_code budget_paused, docs/PIPELINE_SPEC.md §5.3, §6), in the last 15 minutes. A block of
# its own rather than an error_code label on dmc_runs_finished_15m, whose other skip reasons are
# routine. It reads state, error_code and finished_at only: the count names no workspace.
dmc_runs_budget_paused_15m:
  query: |
    SELECT count(*)::float8 AS runs
    FROM runs
    WHERE state = 'skipped' AND error_code = 'budget_paused'
      AND finished_at > now() - interval '15 minutes'
  metrics:
    - runs:
        usage: GAUGE
        description: Runs skipped with budget_paused in the last 15 minutes

# Time to review of the fast engine over the last hour: finished_at - created_at of the runs that
# succeeded, so the time covers the queue, the engine and the publication (finished_at is written
# when the review is published, docs/PIPELINE_SPEC.md §3). created_at is the creation of the Run,
# not the delivery of the webhook: the time before the Run exists is not counted. Failed, skipped
# and cancelled runs are not reviews. At low volume the hour holds only a handful of runs and the
# p95 is close to their maximum: the runs column tells one slow run from a trend. There is no bound
# on created_at: a retry may wait up to a day on Retry-After
# (docs/PIPELINE_SPEC.md §4.2), and the whole time counts. The window is on finished_at alone, as
# in dmc_runs_finished_15m and dmc_runs_budget_paused_15m, so this adds no new kind of scan. Both
# columns, state and engine are already granted to metrics_exporter.
dmc_review_time_1h:
  query: |
    SELECT
      count(*)::float8 AS runs,
      coalesce(
        percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM finished_at - created_at)::float8),
        0
      ) AS p95_seconds
    FROM runs
    WHERE state = 'succeeded' AND engine = 'fast'
      AND finished_at > now() - interval '1 hour'
  metrics:
    - runs:
        usage: GAUGE
        description: Fast runs that succeeded in the last hour
    - p95_seconds:
        usage: GAUGE
        description: 95th percentile of finished_at - created_at of those runs, in seconds
