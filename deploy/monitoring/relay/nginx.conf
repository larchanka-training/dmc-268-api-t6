# TCP relay of the prod stores (compose.prod.yml, docs/MONITORING.md §1). It sits on the prod
# application network and on the two internal networks prod-metrics (Prometheus: RabbitMQ metrics)
# and prod-sql (Grafana: PostgreSQL data source), so each reaches the service it needs and nothing
# else: Redis, the other ports and the prod containers stay out of reach.
# The upstream names go through a variable, so nginx resolves them per connection with the Docker
# resolver: a recreated prod store (new IP) is found again without restarting the relay.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 64;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_connect_timeout 5s;

    # RabbitMQ Prometheus plugin: /metrics and /metrics/detailed.
    server {
        listen 15692;
        set $rabbitmq rabbitmq:15692;
        proxy_pass $rabbitmq;
    }

    # PostgreSQL for the Grafana data source (role grafana_reader, column grants).
    server {
        listen 5432;
        set $postgres postgres:5432;
        proxy_pass $postgres;
    }
}
