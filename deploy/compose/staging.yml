# Base stack. Project name comes from deploy.sh (-p), published ports or the edge network
# from an override: compose.ports.yml (dedicated host) or compose.edge.yml (course VPS).
# PostgreSQL, RabbitMQ and Redis publish no ports: they stay on the project network (SD §13).
services:
  api:
    image: ${IMAGE:?IMAGE is required}
    # Application secrets from GitHub, only the keys that are set (deploy/scripts/env-file.sh).
    # api.env only: the API reads no GitHub App credentials, app.env is for the workers.
    env_file:
      - api.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      # Cache per SD §10; the application does not read it yet.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      AUTH_JWT_ISSUER: dmc-268-api
      AUTH_JWT_AUDIENCE: dmc-268-ui
    # No dependency on RabbitMQ or Redis: the API connects to the broker on the first publication,
    # so a broker or cache outage must not keep a recreated API from starting. up --wait in
    # deploy.sh still waits for every healthcheck.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Review worker (#34): consumes review.run.fast and review.publish, runs the leader loop. No HTTP
  # port: the image healthcheck is replaced by the age of the heartbeat file it touches every 10 s
  # once its consumers are attached (app/common/infrastructure/heartbeat.py). A worker that exits
  # or whose event loop freezes fails up --wait in deploy.sh, and the deploy rolls back. Stuck
  # work inside a running loop keeps beating: the heartbeat is liveness, not progress.
  worker:
    image: ${IMAGE:?IMAGE is required}
    command: ["python", "-m", "app.worker"]
    # app.env: GitHub App credentials; worker.env: LLM gateway (docs/SECRETS.md).
    env_file:
      - app.env
      - worker.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
    # Unlike the API, the worker cannot start without the broker: it declares the topology first.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      # An image built before the heartbeat (a rollback target older than #35, part 2) never
      # beats: for it a running process counts as healthy. Every newer image is checked strictly.
      test:
        - CMD-SHELL
        - test ! -f /srv/app/common/infrastructure/heartbeat.py || exec python -m app.common.infrastructure.heartbeat /tmp/worker.heartbeat 30
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Webhook worker (#11): projects stored GitHub deliveries (installations, repositories, pull
  # requests). Without it deliveries are accepted (202) and stored but never processed.
  webhook-worker:
    image: ${IMAGE:?IMAGE is required}
    command: ["python", "-m", "app.webhook_worker"]
    # app.env: GitHub App credentials; webhook-worker.env: GITHUB_APP_BOT_LOGIN (docs/SECRETS.md).
    env_file:
      - app.env
      - webhook-worker.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
      WORKER_HEARTBEAT_FILE: /tmp/webhook-worker.heartbeat
    # No broker: the projection only writes PostgreSQL, the reconciler of the API publishes the runs
    # (app/webhook_worker.py composes the receiver without a run publisher).
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      # An image built before the heartbeat (a rollback target older than #35, part 2) never
      # beats: for it a running process counts as healthy. Every newer image is checked strictly.
      test:
        - CMD-SHELL
        - test ! -f /srv/app/common/infrastructure/heartbeat.py || exec python -m app.common.infrastructure.heartbeat /tmp/webhook-worker.heartbeat 30
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # This one-shot service must complete before API containers are started.  Keeping
  # both commands in the image avoids needing uv or a checkout on the deploy host.
  bootstrap:
    image: ${IMAGE:?IMAGE is required}
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap.seed_prompts"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    pull_policy: always

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # The node name, and with it the data directory in the volume, comes from the hostname:
    # without a fixed one every recreate starts a new node and durable queues are lost.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cache only (SD §10), not a queue: no persistence and no volume. Bounded on the shared VPS: at
  # 128 MB the least recently used keys are evicted instead of writes failing.
  redis:
    image: redis:8-alpine
    user: redis
    # The password goes through a config file on tmpfs, not argv, so it stays out of ps.
    command:
      - sh
      - -c
      - printf 'requirepass %s\nsave ""\nappendonly no\nmaxmemory 128mb\nmaxmemory-policy allkeys-lru\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  rabbitmq-data:
